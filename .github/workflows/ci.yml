name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if grep -q $'\r' install.sh; then echo "CRLF found in install.sh"; exit 1; fi
          test -x install.sh
          sh -n install.sh
          if command -v dash >/dev/null; then dash -n install.sh; fi
          SRC_FILES=$(find skills -type f | wc -l)
          SRC_DIRS=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          SRC_LIST=$(find skills -mindepth 1 -maxdepth 1 | sort)
          # every installed file, not just SKILL.md — a copy that dropped
          # tdd/tests.md would otherwise pass. Each installed directory also
          # gains one .lean-skills ownership marker.
          install_ok() {
            test "$(find "$1" -type f | wc -l)" -eq "$((SRC_FILES + SRC_DIRS))"
            test "$(find "$1" -name SKILL.md | wc -l)" -eq 9
            test "$(find "$1" -name .lean-skills | wc -l)" -eq "$SRC_DIRS"
          }
          # a guard must refuse with exit 2, say so, and leave the repo untouched
          guard_refuses() {
            set +e; out=$(CLAUDE_SKILLS_DIR="$1" ./install.sh ${2:--y} 2>&1); rc=$?; set -e
            test "$rc" -eq 2          || { echo "FAIL $1: exit $rc, want 2"; echo "$out"; exit 1; }
            grep -q 'refusing:' <<<"$out" || { echo "FAIL $1: no refusal message"; exit 1; }
            test -z "$(git status --porcelain)" || { echo "FAIL $1: repo dirty"; git status --porcelain; exit 1; }
            test "$(find skills -mindepth 1 -maxdepth 1 | sort)" = "$SRC_LIST" || { echo "FAIL $1: changed the contents of skills/"; exit 1; }
          }

          export CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills"
          ./install.sh -y && install_ok "$CLAUDE_SKILLS_DIR"
          ./install.sh -y && install_ok "$CLAUDE_SKILLS_DIR"

          guard_refuses "$PWD/skills"            # target is the source
          guard_refuses "$PWD/skills/tdd"        # target inside the source
          guard_refuses "$PWD"                   # source inside the target
          guard_refuses "$PWD/skills/a/b/c"      # nested + non-existent (exercises the undo path)
          ln -s "$PWD" "$RUNNER_TEMP/link-root"
          guard_refuses "$RUNNER_TEMP/link-root"          # source inside a linked target
          ln -s "$PWD/skills" "$RUNNER_TEMP/link-src"
          guard_refuses "$RUNNER_TEMP/link-src"  # symlink to the source
          ln -s "$RUNNER_TEMP/link-src" "$RUNNER_TEMP/link-chain"
          guard_refuses "$RUNNER_TEMP/link-chain"        # chained symlink
          guard_refuses "$RUNNER_TEMP/link-src/nested"     # parent component is a symlink
          guard_refuses "$RUNNER_TEMP/link-src/x/y"        # ...two levels down
          guard_refuses "$PWD/skills" --uninstall        # the delete-only path is guarded too

          # set-but-empty must fail loudly rather than write to $HOME
          set +e; CLAUDE_SKILLS_DIR="" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 2 || { echo "empty CLAUDE_SKILLS_DIR should exit 2, got $rc"; exit 1; }

          T="$RUNNER_TEMP/skills dir"            # spaces in the path
          CLAUDE_SKILLS_DIR="$T" ./install.sh -y >/dev/null && install_ok "$T"
          mkdir -p "$T/not-ours" && : > "$T/not-ours/SKILL.md"
          # a skill of the user's that happens to share one of our names
          mkdir -p "$T/tdd-user-check" && : > "$T/tdd-user-check/SKILL.md"
          rm -rf "$T/tdd" && mkdir -p "$T/tdd" && echo USER-OWNED > "$T/tdd/SKILL.md"
          # install now exits 3 when it keeps something it cannot claim
          set +e; CLAUDE_SKILLS_DIR="$T" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 3 || { echo "install keeping a user skill should exit 3, got $rc"; exit 1; }
          grep -q USER-OWNED "$T/tdd/SKILL.md"                  # install must not clobber it
          # uninstall now exits 3 when it spares something it cannot claim
          set +e; CLAUDE_SKILLS_DIR="$T" ./install.sh --uninstall >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 3 || { echo "uninstall sparing a user skill should exit 3, got $rc"; exit 1; }
          test -f "$T/not-ours/SKILL.md"                       # a foreign skill survives
          grep -q USER-OWNED "$T/tdd/SKILL.md"                  # ...including a same-named one
          test "$(find "$T" -name SKILL.md | wc -l)" -eq 3      # ours are gone, three of theirs remain
          test -z "$(git status --porcelain)"

          # a foreign .lean-skills must not count as ours (content, not mere presence)
          mkdir -p "$T/implement"; echo "someone elses marker" > "$T/implement/.lean-skills"
          echo THEIRS > "$T/implement/SKILL.md"
          set +e; CLAUDE_SKILLS_DIR="$T" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 3 || { echo "a foreign marker was accepted as ours"; exit 1; }
          grep -q THEIRS "$T/implement/SKILL.md"

          # a non-directory at one of our names is still the users
          rm -rf "$T/worktree"; : > "$T/worktree"
          set +e; CLAUDE_SKILLS_DIR="$T" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test -f "$T/worktree" || { echo "install destroyed a non-directory at our name"; exit 1; }
          test "$rc" -eq 3 || { echo "a non-directory at our name must block too, got $rc"; exit 1; }
          rm -f "$T/worktree"

          # no -y and no tty: nothing may be overwritten, not even with --adopt
          C="$RUNNER_TEMP/consent"; mkdir -p "$C/grill-me"; echo MINE > "$C/grill-me/SKILL.md"
          set +e; CLAUDE_SKILLS_DIR="$C" ./install.sh --adopt </dev/null >/dev/null 2>&1; set -e
          grep -q MINE "$C/grill-me/SKILL.md" || { echo "--adopt overwrote without consent"; exit 1; }

          # a relative target is refused, and writes nothing
          set +e; CLAUDE_SKILLS_DIR=rel/here ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 2 || { echo "relative CLAUDE_SKILLS_DIR should exit 2, got $rc"; exit 1; }
          test ! -e rel || { echo "wrote into a relative path"; exit 1; }

          # the clean uninstall path: all ours, nothing spared, exit 0
          K="$RUNNER_TEMP/clean"
          CLAUDE_SKILLS_DIR="$K" ./install.sh -y >/dev/null
          CLAUDE_SKILLS_DIR="$K" ./install.sh --uninstall >/dev/null
          test "$(find "$K" -name SKILL.md | wc -l)" -eq 0
          test "$(find "$K" -name .lean-skills | wc -l)" -eq 0

          # atomic swap kept, and no staging directory left behind
          grep -qF 'mv "$staging" "$dest_abs/$name"' install.sh
          test -z "$(find "$RUNNER_TEMP" -maxdepth 3 -name '.lean-skills-staging-*')"

          # upgrading from a version that wrote no markers must not silently no-op
          U="$RUNNER_TEMP/legacy"
          for s in $(ls skills); do mkdir -p "$U/$s"; echo OLD > "$U/$s/SKILL.md"; done
          mkdir -p "$U/code-review" && echo OLD > "$U/code-review/SKILL.md"   # a retired name
          set +e; CLAUDE_SKILLS_DIR="$U" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 3 || { echo "legacy upgrade should exit 3, got $rc"; exit 1; }
          grep -q OLD "$U/tdd/SKILL.md" || { echo "legacy upgrade overwrote without --adopt"; exit 1; }
          CLAUDE_SKILLS_DIR="$U" ./install.sh -y --adopt >/dev/null
          if grep -q OLD "$U/tdd/SKILL.md"; then echo "--adopt did not take over"; exit 1; fi
          test ! -e "$U/code-review" || { echo "--adopt left the retired skill behind"; exit 1; }
          test "$(find "$U" -name .lean-skills | wc -l)" -eq "$SRC_DIRS"

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $srcFiles = (Get-ChildItem -Recurse -File skills).Count
          $srcDirs = (Get-ChildItem -Directory skills).Count
          function Assert-Install($p) {
            # each installed directory also gains one .lean-skills marker
            $want = $srcFiles + $srcDirs
            $f = (Get-ChildItem -Recurse -File -Force -LiteralPath $p).Count
            $s = (Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $p).Count
            $m = (Get-ChildItem -Recurse -Filter .lean-skills -Force -LiteralPath $p).Count
            if ($f -ne $want) { throw "expected $want files, got $f" }
            if ($s -ne 9) { throw "expected 9 SKILL.md, got $s" }
            if ($m -ne $srcDirs) { throw "expected $srcDirs markers, got $m" }
          }
          function Assert-Refused($p, $op) {
            $threw = $false
            $env:CLAUDE_SKILLS_DIR = $p
            try { if ($op -eq 'Uninstall') { & .\install.ps1 -Uninstall | Out-Null } else { & .\install.ps1 -Yes | Out-Null } }
            catch { $threw = $true; if ($_.Exception.Message -notmatch 'refusing:') { throw "wrong error for ${p}: $_" } }
            if (-not $threw) { throw "guard did not refuse: $p ($op)" }
            $dirty = git status --porcelain
            if ($dirty) { throw "repo dirty after ${p}: $dirty" }
          }

          $env:CLAUDE_SKILLS_DIR = Join-Path $env:RUNNER_TEMP 'skills'
          .\install.ps1 -Yes | Out-Null; Assert-Install $env:CLAUDE_SKILLS_DIR
          .\install.ps1 -Yes | Out-Null; Assert-Install $env:CLAUDE_SKILLS_DIR

          $repo = (Get-Location).Path
          Assert-Refused (Join-Path $repo 'skills') 'Yes'
          Assert-Refused (Join-Path $repo 'skills\tdd') 'Yes'
          Assert-Refused $repo 'Yes'
          Assert-Refused (Join-Path $repo 'skills\a\b\c') 'Yes'
          # junction topologies: direct, chained, and a link on a parent component.
          # GetFullPath does not resolve reparse points, so only the write-probe catches these.
          cmd /c mklink /J "$env:RUNNER_TEMP\jroot" "$repo" | Out-Null
          cmd /c mklink /J "$env:RUNNER_TEMP\j1" "$repo\skills" | Out-Null
          cmd /c mklink /J "$env:RUNNER_TEMP\j2" "$env:RUNNER_TEMP\j1" | Out-Null
          foreach ($op in @('Yes','Uninstall')) {
            Assert-Refused "$env:RUNNER_TEMP\jroot\skills" $op
            Assert-Refused "$env:RUNNER_TEMP\j1" $op
            Assert-Refused "$env:RUNNER_TEMP\j2" $op
          }
          # a link on a *parent* component: the target lands inside the source,
          # which a marker written into the target cannot detect
          Assert-Refused "$env:RUNNER_TEMP\j1\sub" 'Yes'
          Assert-Refused "$env:RUNNER_TEMP\j1\x\y" 'Yes'
          # junction to the repo root: the source sits inside the target, which a
          # canary planted in the source can never reveal by walking upward
          foreach ($op in @('Yes','Uninstall')) { Assert-Refused "$env:RUNNER_TEMP\jroot" $op }

          # Windows drops empty environment variables, so the set-but-empty case
          # install.sh guards against cannot occur here — asserted, not assumed.
          $env:CLAUDE_SKILLS_DIR = ''
          if (Test-Path Env:\CLAUDE_SKILLS_DIR) { throw "Windows kept an empty env var; install.ps1 needs the guard install.sh has" }

          $T = Join-Path $env:RUNNER_TEMP 'skills dir'
          $env:CLAUDE_SKILLS_DIR = $T
          .\install.ps1 -Yes | Out-Null; Assert-Install $T
          [IO.Directory]::CreateDirectory((Join-Path $T 'not-ours')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $T 'not-ours\SKILL.md'), '')
          # a skill of the user's that happens to share one of our names
          Remove-Item -Recurse -Force -LiteralPath (Join-Path $T 'tdd')
          [IO.Directory]::CreateDirectory((Join-Path $T 'tdd')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $T 'tdd\SKILL.md'), 'USER-OWNED')
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "install keeping a user skill should exit 3, got $LASTEXITCODE" }
          if ((Get-Content -Raw -LiteralPath (Join-Path $T 'tdd\SKILL.md')) -notmatch 'USER-OWNED') {
            throw "install clobbered a user-owned same-named skill"
          }
          # uninstall now exits 3 when it spares something it cannot claim
          & powershell -NoProfile -File .\install.ps1 -Uninstall | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "uninstall sparing a user skill should exit 3, got $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $T 'not-ours\SKILL.md'))) { throw "uninstall removed a foreign skill" }
          if ((Get-Content -Raw -LiteralPath (Join-Path $T 'tdd\SKILL.md')) -notmatch 'USER-OWNED') {
            throw "uninstall removed a user-owned same-named skill"
          }
          $left = (Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $T).Count
          if ($left -ne 2) { throw "uninstall left $left SKILL.md, want 2 (both theirs)" }
          # parity with the bash leg: --Adopt, retired names, and the legacy upgrade
          $U = Join-Path $env:RUNNER_TEMP 'legacy'
          $skillNames = @(Get-ChildItem -Directory skills | ForEach-Object { $_.Name })
          foreach ($n in $skillNames) {
            [IO.Directory]::CreateDirectory((Join-Path $U $n)) | Out-Null
            [IO.File]::WriteAllText((Join-Path $U ($n + '\SKILL.md')), 'OLD')
          }
          [IO.Directory]::CreateDirectory((Join-Path $U 'code-review')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $U 'code-review\SKILL.md'), 'OLD')
          $env:CLAUDE_SKILLS_DIR = $U
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "legacy upgrade should exit 3, got $LASTEXITCODE" }
          if ((Get-Content -Raw (Join-Path $U 'tdd\SKILL.md')) -notmatch 'OLD') { throw "overwrote without -Adopt" }
          & powershell -NoProfile -File .\install.ps1 -Yes -Adopt | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "-Adopt should succeed, got $LASTEXITCODE" }
          if ((Get-Content -Raw (Join-Path $U 'tdd\SKILL.md')) -match 'OLD') { throw "-Adopt did not take over" }
          if (Test-Path -LiteralPath (Join-Path $U 'code-review')) { throw "-Adopt left the retired skill behind" }
          $m = (Get-ChildItem -Recurse -Filter .lean-skills -Force -LiteralPath $U).Count
          if ($m -ne $skillNames.Count) { throw "expected $($skillNames.Count) markers after adopt, got $m" }
          & powershell -NoProfile -File .\install.ps1 -Uninstall -Adopt | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uninstall -Adopt should exit 0, got $LASTEXITCODE" }
          if ((Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $U -ErrorAction SilentlyContinue).Count -ne 0) {
            throw "uninstall -Adopt left skills behind"
          }

          # a foreign marker is not ours; a non-directory at our name is not ours
          $F = Join-Path $env:RUNNER_TEMP 'foreign'
          [IO.Directory]::CreateDirectory((Join-Path $F 'implement')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $F 'implement\.lean-skills'), 'someone elses marker')
          [IO.File]::WriteAllText((Join-Path $F 'implement\SKILL.md'), 'THEIRS')
          [IO.File]::WriteAllText((Join-Path $F 'worktree'), 'a plain file at our name')
          $env:CLAUDE_SKILLS_DIR = $F
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "foreign marker / non-directory should block, got $LASTEXITCODE" }
          if ((Get-Content -Raw (Join-Path $F 'implement\SKILL.md')) -notmatch 'THEIRS') { throw "a foreign marker was accepted as ours" }
          if (-not (Test-Path -LiteralPath (Join-Path $F 'worktree') -PathType Leaf)) { throw "destroyed a non-directory at our name" }

          # a relative target is refused and writes nothing
          $env:CLAUDE_SKILLS_DIR = 'rel-here'
          $threw = $false
          try { & .\install.ps1 -Yes | Out-Null } catch { $threw = $true }
          if (-not $threw) { throw "relative CLAUDE_SKILLS_DIR was accepted" }
          if (Test-Path -LiteralPath (Join-Path $repo 'rel-here')) { throw "wrote into a relative path" }

          # the script must parse, including branches this run never enters
          $perr = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$null, [ref]$perr)
          if ($perr) { throw "install.ps1 parse errors: $($perr -join '; ')" }

          $dirty = git status --porcelain
          if ($dirty) { throw "repo dirty at end: $dirty" }

      - name: manifests and frontmatter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'EOF'
          import io, json, os, re
          for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json'):
              json.load(io.open(p, encoding='utf-8'))
          resident, manual = [], []
          for d in sorted(os.listdir('skills')):
              assert os.path.isdir(f'skills/{d}'), f'stray file in skills/: {d}'
              text = io.open(f'skills/{d}/SKILL.md', encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
              assert m, f'{d}: no frontmatter'
              fm = m.group(1)
              name = re.search(r'^name:\s*(\S+)', fm, re.M)
              assert name and name.group(1) == d, f'{d}: name/dir mismatch'
              assert re.search(r'^description:', fm, re.M), f'{d}: no description'
              (manual if re.search(r'^disable-model-invocation:\s*true', fm, re.M)
                      else resident).append(d)
          assert len(resident) == 5 and len(manual) == 4, (resident, manual)
          assert 'code-review' not in resident + manual, 'never shadow the built-in /code-review'
          # the installers and the plugin blurb restate these lists; keep them honest
          for path in ('install.sh', 'install.ps1'):
              blob = io.open(path, encoding='utf-8').read()
              tail = blob[blob.index('Resident (model-invoked)'):]
              for s in resident:
                  assert s in tail, f'{path}: {s} missing from the resident line'
              for s in manual:
                  assert s in tail, f'{path}: {s} missing from the manual line'
          plugin = json.load(io.open('.claude-plugin/plugin.json', encoding='utf-8'))
          mk = json.load(io.open('.claude-plugin/marketplace.json', encoding='utf-8'))
          p0 = mk['plugins'][0]
          total = len(resident) + len(manual)
          blurb = f'{total} skills, {len(resident)} resident'
          for d in (plugin['description'], p0['description']):
              assert blurb in d, (blurb, d)
          assert plugin['version'] == p0['version'] == mk['metadata']['version'], 'version drift'
          assert plugin['version'] in io.open('CHANGELOG.md', encoding='utf-8').read(), 'version missing from CHANGELOG'
          # the installer lists must name every skill and invent none
          import re as _re
          for path in ('install.sh', 'install.ps1'):
              blob = io.open(path, encoding='utf-8').read()
              tail = blob[blob.index('Resident (model-invoked)'):]
              listed = set(_re.findall(r'(?<![\w-])[a-z][a-z0-9]*(?:-[a-z0-9]+)+(?![\w-])', tail))
              listed |= {w for w in _re.findall(r'(?<![\w-])[a-z]{3,}(?![\w-])', tail)}
              known = set(resident) | set(manual)
              ghosts = {n for n in listed if '-' in n} - known - {'model-invoked', 'user-invoked', 'lean-skills', 'spec-review'}
              assert not ghosts, f'{path} advertises skills that do not exist: {sorted(ghosts)}'
          print('ok: 9 skills,', len(resident), 'resident,', len(manual), 'manual; installer lists agree')
          EOF

      - name: spec-review's diff recipe captures every change class
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Anchor on the skill text: if the recipe in SKILL.md changes, this test
          # must be revisited rather than silently keep testing a stale command.
          S=skills/spec-review/SKILL.md
          grep -q 'git merge-base <base-ref> HEAD' "$S"
          grep -q 'git diff <that-literal-sha>' "$S"
          grep -q 'git log <that-literal-sha>..HEAD --oneline' "$S"
          grep -q 'git status --porcelain' "$S"
          grep -q 'printed SHA' "$S"

          R="$RUNNER_TEMP/fixture"; rm -rf "$R"; git init -q "$R"; cd "$R"
          git config user.email ci@ci; git config user.name ci
          printf 'base\n' > kept.txt; printf 'gone\n' > gone.txt; printf 'old\n' > old-name.txt
          git add -A; git commit -qm base
          BASE_SHA=$(git merge-base HEAD HEAD)
          printf 'committed-change\n' >> kept.txt; git commit -aqm feature
          printf 'staged-content\n' > staged.txt; git add staged.txt
          printf 'unstaged-change\n' >> kept.txt
          printf 'untracked-content\n' > 'un tracked.txt'
          git rm -q gone.txt
          git mv old-name.txt new-name.txt
          PATCH=$(git diff "$BASE_SHA")
          STATUS=$(git status --porcelain)
          echo "$PATCH"  | grep -q 'committed-change'
          echo "$PATCH"  | grep -q 'staged-content'
          echo "$PATCH"  | grep -q 'unstaged-change'
          echo "$PATCH"  | grep -q 'gone.txt'
          echo "$PATCH"  | grep -q 'new-name.txt'
          echo "$STATUS" | grep -q 'un tracked.txt'
          # The skill warns that an empty base silently degrades `git diff <BASE_SHA>`
          # into an unstaged-only diff. Prove it on a file that is *only* staged —
          # unlike a modified file, it cannot leak in as diff context.
          if git diff ${UNSET_ON_PURPOSE:-} --name-only | grep -qx 'staged.txt'; then
            echo "empty-base diff should NOT see staged files"; exit 1
          fi
          git diff "$BASE_SHA" --name-only | grep -qx 'staged.txt'   # but the real base does
          # and that a bad fixed point fails loudly rather than silently
          git merge-base "$BASE_SHA" HEAD >/dev/null
          if git merge-base HEAD 0000000000000000000000000000000000000000 >/dev/null 2>&1; then
            echo "expected merge-base against a bogus ref to fail"; exit 1
          fi
          echo "diff recipe: all change classes visible; degradation modes confirmed"

      - name: git recipes in the skills actually run
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          M=skills/resolving-merge-conflicts/SKILL.md
          S=skills/spec-review/SKILL.md
          # what the skills must say
          grep -qF 'merge-base HEAD MERGE_HEAD' "$M"
          grep -qF 'REBASE_HEAD^ REBASE_HEAD' "$M"
          grep -qF 'CHERRY_PICK_HEAD^ CHERRY_PICK_HEAD' "$M"
          grep -qF 'REVERT_HEAD^ REVERT_HEAD' "$M"
          grep -qF 'git restore --staged --' "$M"
          grep -qF 'name-status -M' "$M"
          grep -qF 'core.quotePath=false' "$M"
          grep -qF 'hash-object -t tree' "$M"
          grep -qF 'Never fall back to `@{upstream}`' "$S"
          grep -qF 'baseRefOid' "$S"
          # and what they must never say again - each of these shipped as a bug once
          for bad in 'diff --name-only HEAD MERGE_HEAD' 'diff --name-status -M HEAD MERGE_HEAD' 'diff --cached --name-only'; do
            if grep -qF "$bad" "$M"; then echo "retired mistake is back in $M: $bad"; exit 1; fi
          done
          for bad in 'baseRepository' 'merge-base HEAD @{upstream}'; do
            if grep -qF "$bad" "$S" && ! grep -qF "Never fall back to \`@{upstream}\`" "$S"; then
              echo "retired mistake is back in $S: $bad"; exit 1
            fi
          done
          if grep -qF 'baseRepository' "$S"; then echo "baseRepository is not a gh field"; exit 1; fi

          new_repo() {
            rm -rf "$1"; git init -q "$1"; cd "$1"
            git config user.email ci@ci; git config user.name ci
            echo base > f.txt; echo base > side.txt
            git add -A; git commit -qm base
            git checkout -qb feat; echo theirs > f.txt; git commit -aqm theirs
            git checkout -q master 2>/dev/null || git checkout -q main
            echo mine > f.txt; echo ours-only > side.txt; git commit -aqm mine
          }

          new_repo "$RUNNER_TEMP/r-merge"
          git merge feat >/dev/null 2>&1 || true
          BASE=$(git merge-base HEAD MERGE_HEAD)
          test -n "$BASE" || { echo "merge-base printed nothing on a normal merge"; exit 1; }
          BRINGS=$(git diff --name-only "$BASE" MERGE_HEAD)
          test "$BRINGS" = "f.txt" || { echo "merge brings [$BRINGS], want f.txt"; exit 1; }
          if ! git diff --name-only HEAD MERGE_HEAD | grep -q side.txt; then
            echo "fixture no longer shows why HEAD..MERGE_HEAD is the wrong range"; exit 1
          fi
          echo user > staged.txt; git add staged.txt
          echo more >> side.txt
          echo note > untracked.txt
          USERS=$(comm -23 <(git diff --cached --name-only HEAD | sort) <(echo "$BRINGS" | sort))
          test "$USERS" = "staged.txt" || { echo "user set [$USERS], want staged.txt"; exit 1; }
          git restore --staged -- $USERS
          if git restore --staged -- untracked.txt 2>/dev/null; then
            echo "expected git restore --staged to reject an untracked path"; exit 1
          fi
          echo resolved > f.txt; git add f.txt; git commit -qm merged
          git show --name-only --format= HEAD | grep -qx f.txt
          if git show --name-only --format= HEAD | grep -q staged.txt; then
            echo "the user's staged file landed in the merge commit"; exit 1
          fi
          git status --porcelain | grep -q '^?? untracked.txt'
          git status --porcelain | grep -q '^ M side.txt'

          # unrelated histories: merge-base prints nothing, and an empty base must not
          # be substituted into the diff - it would compare against the working tree
          rm -rf "$RUNNER_TEMP/r-unrel"; git init -q "$RUNNER_TEMP/r-unrel"; cd "$RUNNER_TEMP/r-unrel"
          git config user.email ci@ci; git config user.name ci
          echo a > shared.txt; echo a > a-only.txt; git add -A; git commit -qm A
          git checkout -q --orphan other; git rm -rqf .
          echo b > shared.txt; echo b > b-only.txt; git add -A; git commit -qm B
          git checkout -q master 2>/dev/null || git checkout -q main
          git merge --allow-unrelated-histories other >/dev/null 2>&1 || true
          if git merge-base HEAD MERGE_HEAD >/dev/null 2>&1; then
            echo "fixture no longer shows the unrelated-histories case"; exit 1
          fi
          EMPTYTREE=$(git hash-object -t tree /dev/null)
          BRINGS=$(git diff --name-only "$EMPTYTREE" MERGE_HEAD | sort | tr -s '[:space:]' ',' | sed 's/,$//')
          test "$BRINGS" = "b-only.txt,shared.txt" || { echo "empty-tree base brings [$BRINGS]"; exit 1; }
          COLLAPSED=$(git diff --name-only MERGE_HEAD | sort | tr -s '[:space:]' ',' | sed 's/,$//')
          test "$COLLAPSED" != "$BRINGS" || { echo "fixture no longer shows why a collapsed base is wrong"; exit 1; }

          new_repo "$RUNNER_TEMP/r-cp"
          git cherry-pick feat >/dev/null 2>&1 || true
          test -f "$(git rev-parse --git-dir)/CHERRY_PICK_HEAD"
          git diff --name-only CHERRY_PICK_HEAD^ CHERRY_PICK_HEAD | grep -qx f.txt
          if git diff --name-only REBASE_HEAD^ REBASE_HEAD >/dev/null 2>&1; then
            echo "REBASE_HEAD resolved during a cherry-pick; the per-operation split is moot"; exit 1
          fi

          # a rename gives only the new path under --name-only; -M gives both
          new_repo "$RUNNER_TEMP/r-mv"
          git merge feat >/dev/null 2>&1 || true
          git mv side.txt renamed.txt
          if git diff --cached --name-only HEAD | grep -qx side.txt; then
            echo "fixture no longer shows --name-only hiding the old path"; exit 1
          fi
          git diff --cached --name-status -M HEAD | grep -q 'side.txt'

          new_repo "$RUNNER_TEMP/r-up"
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git remote add origin "$RUNNER_TEMP/origin.git"
          git push -q origin HEAD:main
          git checkout -qb feature; echo w > w.txt; git add -A; git commit -qm w
          git push -q -u origin feature
          test "$(git merge-base HEAD '@{upstream}')" = "$(git rev-parse HEAD)"
          test -z "$(git diff --name-only "$(git merge-base HEAD '@{upstream}')")"
          git merge-base HEAD origin/main >/dev/null

          # a PR's baseRefName is a branch name, not a usable ref
          git push -q origin HEAD:dev
          git fetch -q origin
          if git rev-parse --verify dev >/dev/null 2>&1; then
            echo "fixture no longer shows that a bare base branch name may not resolve"; exit 1
          fi
          git rev-parse --verify refs/remotes/origin/dev >/dev/null
          git merge-base refs/remotes/origin/dev HEAD >/dev/null
          echo "git recipes: merge range, restore split, per-operation refs and base selection all behave as documented"

      - name: worktree and plan-path recipes actually run
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          W=skills/worktree/SKILL.md
          grep -qF 'WTDIR=.worktrees' "$W"
          grep -qF 'git check-ignore -q "$WTDIR/$BRANCH"' "$W"
          grep -qF 'git rev-parse --is-inside-work-tree' "$W"
          grep -qF 'git worktree remove' "$W"

          R="$RUNNER_TEMP/r-wt"; rm -rf "$R"; git init -q "$R"; cd "$R"
          git config user.email ci@ci; git config user.name ci
          echo x > f.txt; git add -A; git commit -qm base

          # the skill says: test a path INSIDE the directory, because a pattern
          # ending in / cannot match a path that does not exist yet
          BRANCH=fix-thing
          WTDIR=.worktrees
          echo "$WTDIR/" >> "$(git rev-parse --git-common-dir)/info/exclude"
          if git check-ignore -q "$WTDIR"; then
            echo "fixture no longer shows the directory-itself false negative"; exit 1
          fi
          git check-ignore -q "$WTDIR/$BRANCH"

          # and the mismatch the WTDIR variable exists to prevent
          if git check-ignore -q "worktrees/$BRANCH"; then
            echo "a differently-named directory was somehow already ignored"; exit 1
          fi

          git worktree add -q "$WTDIR/$BRANCH" -b "$BRANCH"
          test -z "$(git status --porcelain)" || { echo "the worktree was not ignored"; exit 1; }

          # the plan path must resolve to the main checkout from inside the worktree
          mkdir -p "$(git rev-parse --git-common-dir)/../.plans"
          echo "# plan" > "$(git rev-parse --git-common-dir)/../.plans/$BRANCH.md"
          cd "$WTDIR/$BRANCH"
          test ! -e .plans || { echo "fixture is wrong: an untracked .plans entered the worktree"; exit 1; }
          test -f "$(git rev-parse --git-common-dir)/../.plans/$BRANCH.md"             || { echo "the plan path does not resolve from inside a worktree"; exit 1; }
          cd "$R"

          # teardown, and the two loud failures the skill relies on
          if git worktree remove "$WTDIR/nope" 2>/dev/null; then
            echo "removing a non-worktree should fail"; exit 1
          fi
          git worktree remove "$WTDIR/$BRANCH"
          test ! -e "$WTDIR/$BRANCH"

          # outside a repository, the Step 0 gate must not read as a normal checkout
          mkdir -p "$RUNNER_TEMP/not-a-repo"; cd "$RUNNER_TEMP/not-a-repo"
          if [ "$(git rev-parse --is-inside-work-tree 2>/dev/null || true)" = "true" ]; then
            echo "the non-repository gate does not hold"; exit 1
          fi
          echo "worktree recipes: ignore gate, WTDIR consistency, plan path across a worktree, teardown"

      - name: completion-scope and remote-object recipes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          M=skills/resolving-merge-conflicts/SKILL.md
          S=skills/spec-review/SKILL.md
          grep -qF 'rebase-merge/onto' "$M"
          grep -qF 'sequencer/head' "$M"
          grep -qF 'git diff --name-only HEAD^1 HEAD' "$M"
          grep -qF 'git cat-file -e' "$S"
          grep -qF 'refs/heads/<default>:refs/remotes/origin/<default>' "$S"
          if grep -qF 'git rev-parse ORIG_HEAD)' "$M"; then echo "ORIG_HEAD is back as the boundary"; exit 1; fi

          seed() {
            rm -rf "$1"; git init -q "$1"; cd "$1"
            git config user.email ci@ci; git config user.name ci
            echo base > f.txt; git add -A; git commit -qm c0
            git checkout -qb feat; echo theirs > f.txt; git commit -aqm feat1
            git checkout -q master 2>/dev/null || git checkout -q main
            echo mine > f.txt; git commit -aqm mine
          }

          # single cherry-pick: ORIG_HEAD does not exist, HEAD is the boundary
          seed "$RUNNER_TEMP/s-cp"
          BOUND=$(git rev-parse HEAD)
          git cherry-pick feat >/dev/null 2>&1 || true
          if git rev-parse ORIG_HEAD >/dev/null 2>&1; then
            echo "fixture no longer shows cherry-pick leaving ORIG_HEAD unset"; exit 1
          fi
          echo wip > user.txt
          echo resolved > f.txt; git add f.txt
          git -c core.editor=true cherry-pick --continue >/dev/null 2>&1
          git log --name-only --oneline "$BOUND..HEAD" | grep -qx f.txt
          git status --porcelain -- user.txt | grep -q 'user.txt'

          # rebase onto a base that already carries other commits
          seed "$RUNNER_TEMP/s-rb"
          git checkout -q feat; echo u > user-wip.txt; git add -A; git commit -qm userwork
          git checkout -q master 2>/dev/null || git checkout -q main
          echo extra > onbase.txt; git add -A; git commit -qm already-on-base
          git checkout -q feat
          git rebase master >/dev/null 2>&1 || git rebase main >/dev/null 2>&1 || true
          ONTO=$(cat .git/rebase-merge/onto 2>/dev/null || cat .git/rebase-apply/onto 2>/dev/null)
          test -n "$ONTO" || { echo "no onto recorded during rebase"; exit 1; }
          echo resolved > f.txt; git add f.txt
          git -c core.editor=true rebase --continue >/dev/null 2>&1
          git log --name-only --oneline "$ONTO..HEAD" | grep -q user-wip.txt
          if git log --name-only --oneline "$ONTO..HEAD" | grep -qx onbase.txt; then
            echo "the onto boundary still sweeps in commits already on the base"; exit 1
          fi
          if ! git log --name-only --oneline "$(git rev-parse ORIG_HEAD)..HEAD" | grep -qx onbase.txt; then
            echo "fixture no longer shows why ORIG_HEAD is the wrong boundary"; exit 1
          fi

          # merge: first-parent diff is what the merge landed on our side
          seed "$RUNNER_TEMP/s-mg"
          git merge feat >/dev/null 2>&1 || true
          echo wip > user.txt
          echo resolved > f.txt; git add f.txt; git commit -qm merged
          git diff --name-only HEAD^1 HEAD | grep -qx f.txt
          git status --porcelain -- user.txt | grep -q 'user.txt'

          # revert
          seed "$RUNNER_TEMP/s-rv"
          BOUND=$(git rev-parse HEAD)
          git revert --no-edit HEAD >/dev/null 2>&1 || true
          test -f .git/REVERT_HEAD || { echo "revert did not conflict as expected"; git revert --abort 2>/dev/null || true; }
          if [ -f .git/REVERT_HEAD ]; then
            echo resolved > f.txt; git add f.txt
            git -c core.editor=true revert --continue >/dev/null 2>&1
            git log --name-only --oneline "$BOUND..HEAD" | grep -qx f.txt
          fi

          # ls-remote resolves a name but downloads nothing
          B="$RUNNER_TEMP/s-rem"; rm -rf "$B"; mkdir -p "$B"; cd "$B"
          git init -q --bare origin.git
          git init -q src; cd src; git config user.email ci@ci; git config user.name ci
          echo a > f.txt; git add -A; git commit -qm base; git branch -M main
          git remote add origin ../origin.git; git push -q origin main
          git checkout -qb feature; echo b >> f.txt; git commit -aqm work; git push -q origin feature
          git checkout -q main; echo only > m.txt; git add -A; git commit -qm main-only; git push -q origin main
          cd "$B"; git --git-dir=origin.git symbolic-ref HEAD refs/heads/main
          git clone -q --single-branch --branch feature "file://$B/origin.git" sc
          cd sc
          DEF=$(git ls-remote --symref origin HEAD | awk '/^ref:/{sub("refs/heads/","",$2); print $2}')
          test "$DEF" = main || { echo "ls-remote gave [$DEF]"; exit 1; }
          SHA=$(git ls-remote origin "refs/heads/$DEF" | cut -f1)
          if git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "fixture no longer shows ls-remote leaving the object absent"; exit 1
          fi
          git fetch -q origin "+refs/heads/$DEF:refs/remotes/origin/$DEF"
          git cat-file -e "$SHA^{commit}"
          git merge-base "refs/remotes/origin/$DEF" HEAD >/dev/null
          echo "completion scope: per-operation boundaries hold; ls-remote needs the fetch the skill now prescribes"

      - name: platform parity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Every contract must be asserted on both Windows and macOS. A step
          # gated to one platform is a contract only that platform has.
          # Allowed exceptions are listed here by name, with the reason.
          python3 - <<'EOF'
          import io, yaml
          allowed = {
              'install.ps1': 'PowerShell only exists on Windows',
              'manifests and frontmatter': 'parses files; no platform surface',
              'official plugin validation (strict)': 'installs an npm package; one platform is enough',
              'platform parity': 'this check itself',
          }
          steps = yaml.safe_load(io.open('.github/workflows/ci.yml', encoding='utf-8'))['jobs']['install']['steps']
          bad = []
          for s in steps:
              name = s.get('name')
              if not name or name in allowed:
                  continue
              cond = s.get('if', '')
              if cond and "!= 'Windows'" not in cond:
                  bad.append((name, cond))
          if bad:
              for n, c in bad:
                  print(f'step "{n}" is gated to one platform: if: {c}')
              print('Gate it with  if: runner.os != Windows  so macOS runs it too,')
              print('or add the step to the allowed list above with a reason.')
              raise SystemExit(1)
          covered = [s.get('name') for s in steps
                     if s.get('name') and s.get('name') not in allowed]
          print('platform parity: these run on macOS as well as Linux ->', ', '.join(covered))
          EOF

      - name: official plugin validation (strict)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@2.1.220
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json

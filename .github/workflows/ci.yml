name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Every RED gate below proves itself against a released tag. checkout
          # fetches no tags by default, so until 0.17.7 `git show v0.17.2:...`
          # failed on every single run and each gate skipped itself in silence.
          # 0 = full history, which is what makes those tags reachable.
          fetch-depth: 0

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # -qF, not a regex: in a BRE `\r` degrades to a literal `r` and matches
          # any r in od's output. No pipe either -- `grep -q` exits on the first
          # match and would SIGPIPE od under `set -o pipefail`.
          has_cr() { grep -qF '\r' <<<"$(od -c < "$1")"; }
          if has_cr install.sh; then echo "CRLF found in install.sh"; exit 1; fi
          # .gitattributes pins install.ps1 to CRLF; PowerShell tolerates LF, but
          # the file must match what the repository declares
          has_cr install.ps1 || { echo "install.ps1 lost its CRLF endings"; exit 1; }
          test -x install.sh
          sh -n install.sh
          if command -v dash >/dev/null; then dash -n install.sh; fi
          # files a SKILL.md links to must still be here: SRC_FILES is derived
          # from the source, so a deleted companion shrinks both sides in step
          test -f skills/tdd/tests.md && test -f skills/tdd/mocking.md
          SRC_FILES=$(find skills -type f | wc -l)
          SRC_DIRS=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)
          SRC_LIST=$(find skills -mindepth 1 -maxdepth 1 | sort)
          # a sentinel the shipped text could contain is a dead assertion
          for s in ZZ-USER-SENTINEL-ZZ ZZ-FOREIGN-SENTINEL-ZZ ZZ-MINE-SENTINEL-ZZ ZZ-OLD-SENTINEL-ZZ; do
            grep -rqF "$s" skills/ && { echo "sentinel $s collides with shipped text"; exit 1; }
          done
          # every installed file, not just SKILL.md — a copy that dropped
          # tdd/tests.md would otherwise pass. Each installed directory also
          # gains one .lean-skills ownership marker.
          install_ok() {
            test "$(find "$1" -type f | wc -l)" -eq "$((SRC_FILES + SRC_DIRS))"
            test "$(find "$1" -name SKILL.md | wc -l)" -eq 9
            test "$(find "$1" -name .lean-skills | wc -l)" -eq "$SRC_DIRS"
            diff -r --exclude=.lean-skills skills "$1" >/dev/null || { echo "installed tree differs from source"; exit 1; }
          }
          # a guard must refuse with exit 2, say so, and leave the repo untouched
          guard_refuses() {
            set +e; out=$(CLAUDE_SKILLS_DIR="$1" ./install.sh ${2:--y} 2>&1); rc=$?; set -e
            test "$rc" -eq 2          || { echo "FAIL $1: exit $rc, want 2"; echo "$out"; exit 1; }
            grep -q 'refusing:' <<<"$out" || { echo "FAIL $1: no refusal message"; exit 1; }
            test -z "$(git status --porcelain)" || { echo "FAIL $1: repo dirty"; git status --porcelain; exit 1; }
            test "$(find skills -mindepth 1 -maxdepth 1 | sort)" = "$SRC_LIST" || { echo "FAIL $1: changed the contents of skills/"; exit 1; }
          }

          export CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills"
          ./install.sh -y && install_ok "$CLAUDE_SKILLS_DIR"
          ./install.sh -y && install_ok "$CLAUDE_SKILLS_DIR"

          guard_refuses "$PWD/skills"            # target is the source
          guard_refuses "$PWD/skills/tdd"        # target inside the source
          guard_refuses "$PWD"                   # source inside the target
          guard_refuses "$PWD/skills/a/b/c"      # nested + non-existent (exercises the undo path)
          ln -s "$PWD" "$RUNNER_TEMP/link-root"
          guard_refuses "$RUNNER_TEMP/link-root"          # source inside a linked target
          ln -s "$PWD/skills" "$RUNNER_TEMP/link-src"
          guard_refuses "$RUNNER_TEMP/link-src"  # symlink to the source
          ln -s "$RUNNER_TEMP/link-src" "$RUNNER_TEMP/link-chain"
          guard_refuses "$RUNNER_TEMP/link-chain"        # chained symlink
          guard_refuses "$RUNNER_TEMP/link-src/nested"     # parent component is a symlink
          guard_refuses "$RUNNER_TEMP/link-src/x/y"        # ...two levels down
          guard_refuses "$PWD/skills" --uninstall        # the delete-only path is guarded too

          # set-but-empty must fail loudly rather than write to $HOME
          set +e; CLAUDE_SKILLS_DIR="" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 2 || { echo "empty CLAUDE_SKILLS_DIR should exit 2, got $rc"; exit 1; }

          T="$RUNNER_TEMP/skills dir"            # spaces in the path
          CLAUDE_SKILLS_DIR="$T" ./install.sh -y >/dev/null && install_ok "$T"
          mkdir -p "$T/not-ours" && : > "$T/not-ours/SKILL.md"
          # a skill of the user's that happens to share one of our names
          mkdir -p "$T/tdd-user-check" && : > "$T/tdd-user-check/SKILL.md"
          rm -rf "$T/tdd" && mkdir -p "$T/tdd" && echo ZZ-USER-SENTINEL-ZZ > "$T/tdd/SKILL.md"
          # install now exits 3 when it keeps something it cannot claim
          set +e; CLAUDE_SKILLS_DIR="$T" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 3 || { echo "install keeping a user skill should exit 3, got $rc"; exit 1; }
          grep -qF ZZ-USER-SENTINEL-ZZ "$T/tdd/SKILL.md"                  # install must not clobber it
          # uninstall now exits 3 when it spares something it cannot claim
          set +e; CLAUDE_SKILLS_DIR="$T" ./install.sh --uninstall >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 3 || { echo "uninstall sparing a user skill should exit 3, got $rc"; exit 1; }
          test -f "$T/not-ours/SKILL.md"                       # a foreign skill survives
          grep -qF ZZ-USER-SENTINEL-ZZ "$T/tdd/SKILL.md"                  # ...including a same-named one
          test "$(find "$T" -name SKILL.md | wc -l)" -eq 3      # ours are gone, three of theirs remain
          test -z "$(git status --porcelain)"

          # a foreign .lean-skills must not count as ours (content, not mere presence)
          mkdir -p "$T/implement"; echo "someone elses marker" > "$T/implement/.lean-skills"
          echo ZZ-FOREIGN-SENTINEL-ZZ > "$T/implement/SKILL.md"
          set +e; CLAUDE_SKILLS_DIR="$T" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 3 || { echo "a foreign marker was accepted as ours"; exit 1; }
          grep -qF ZZ-FOREIGN-SENTINEL-ZZ "$T/implement/SKILL.md"

          # a non-directory at one of our names is still the users
          rm -rf "$T/worktree"; : > "$T/worktree"
          set +e; CLAUDE_SKILLS_DIR="$T" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test -f "$T/worktree" || { echo "install destroyed a non-directory at our name"; exit 1; }
          test "$rc" -eq 3 || { echo "a non-directory at our name must block too, got $rc"; exit 1; }
          rm -f "$T/worktree"

          # no -y and no tty: nothing may be overwritten, not even with --adopt
          C="$RUNNER_TEMP/consent"; mkdir -p "$C/grill-me"; echo ZZ-MINE-SENTINEL-ZZ > "$C/grill-me/SKILL.md"
          set +e; CLAUDE_SKILLS_DIR="$C" ./install.sh --adopt </dev/null >/dev/null 2>&1; set -e
          grep -qF ZZ-MINE-SENTINEL-ZZ "$C/grill-me/SKILL.md" || { echo "--adopt overwrote without consent"; exit 1; }

          # Exit codes are a contract a caller can branch on, so they have to be the
          # same on both platforms. install.ps1 used `throw` for every refusal,
          # which always exits 1 while install.sh exits 2.
          ec() { set +e; ( "$@" ) >/dev/null 2>&1; printf '%s' "$?"; set -e; }
          test "$(ec env CLAUDE_SKILLS_DIR=rel/x ./install.sh -y)" = 2       || { echo "relative path should exit 2"; exit 1; }
          test "$(ec env CLAUDE_SKILLS_DIR=$PWD/skills ./install.sh -y)" = 2 || { echo "target=source should exit 2"; exit 1; }
          test "$(ec ./install.sh --bogus)" = 2                              || { echo "unknown option should exit 2"; exit 1; }
          test "$(ec ./install.sh -h)" = 0                                   || { echo "--help should exit 0"; exit 1; }
          test "$(ec env CLAUDE_SKILLS_DIR=$RUNNER_TEMP/never-made ./install.sh --uninstall)" = 0 \
            || { echo "uninstall on a missing target should exit 0"; exit 1; }

          # A skill directory whose name contains a space installed fine and could
          # then never be uninstalled: the name loop split it into two words that
          # matched nothing, and the real directory stayed for ever.
          Sp="$RUNNER_TEMP/spacename"; mkdir -p "$Sp"
          cp -R skills "$Sp/skills"; cp install.sh "$Sp/"
          mv "$Sp/skills/tdd" "$Sp/skills/two words"
          CLAUDE_SKILLS_DIR="$Sp/t" "$Sp/install.sh" -y >/dev/null
          test "$(find "$Sp/t" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 9 || { echo "a space-named skill did not install"; exit 1; }
          CLAUDE_SKILLS_DIR="$Sp/t" "$Sp/install.sh" --uninstall >/dev/null
          test -z "$(find "$Sp/t" -mindepth 1 -maxdepth 1 -type d)" \
            || { echo "uninstall could not remove a space-named skill: $(find "$Sp/t" -mindepth 1 -maxdepth 1 -type d)"; exit 1; }

          # A drive-letter path is absolute under Git Bash and *relative* on Linux
          # and macOS, where accepting it creates a directory literally called "C:".
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) ;;
            *)
              set +e; CLAUDE_SKILLS_DIR='C:/skills' ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
              test "$rc" -eq 2 || { echo "a drive-letter path should exit 2 on $(uname -s), got $rc"; exit 1; }
              test ! -e 'C:' || { echo 'a directory named C: was created'; exit 1; }
              test -z "$(git status --porcelain)" || { echo "repo dirty after the drive-letter attempt"; exit 1; }
              ;;
          esac

          # A symlink whose target is missing - an unmounted disk, a moved directory -
          # answers false to `-e`, so every "is something already here?" test used to
          # miss it and the install replaced it without consulting the marker.
          Bl="$RUNNER_TEMP/broken"; mkdir -p "$Bl"
          ln -s "$Bl/nowhere" "$Bl/tdd"
          test ! -e "$Bl/tdd" && test -L "$Bl/tdd"     # this is the shape being guarded
          set +e; CLAUDE_SKILLS_DIR="$Bl" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test -L "$Bl/tdd" || { echo "a broken symlink at our name was replaced"; exit 1; }
          test "$rc" -eq 3 || { echo "keeping a broken symlink should exit 3, got $rc"; exit 1; }
          CLAUDE_SKILLS_DIR="$Bl" ./install.sh --uninstall >/dev/null 2>&1 || true
          test -L "$Bl/tdd" || { echo "uninstall removed a broken symlink that is not ours"; exit 1; }
          # ...and --adopt is still able to take it over, deliberately
          CLAUDE_SKILLS_DIR="$Bl" ./install.sh -y --adopt >/dev/null 2>&1
          test -f "$Bl/tdd/SKILL.md" || { echo "--adopt could not take over a broken symlink"; exit 1; }

          # a relative target is refused, and writes nothing
          set +e; CLAUDE_SKILLS_DIR=rel/here ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 2 || { echo "relative CLAUDE_SKILLS_DIR should exit 2, got $rc"; exit 1; }
          test ! -e rel || { echo "wrote into a relative path"; exit 1; }

          # ...and a leading blank does not make one absolute. POSIX reads the
          # first component of " /tmp/x" as a space, so the install landed in a
          # directory named " " under the current one - inside the repository.
          for v in ' /tmp/lead-space' "$(printf '\t/tmp/lead-tab')" '' '   '; do
            set +e; CLAUDE_SKILLS_DIR="$v" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
            test "$rc" -eq 2 || { echo "blank-prefixed CLAUDE_SKILLS_DIR should exit 2, got $rc"; exit 1; }
          done
          test -z "$(find . -maxdepth 1 -name ' ' -o -maxdepth 1 -name "$(printf '\t')")" \
            || { echo "a blank-named directory was created in the repo"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "repo dirty after blank-path attempts"; exit 1; }
          # a real absolute path containing a space must still work
          Sp="$RUNNER_TEMP/with space/skills"
          CLAUDE_SKILLS_DIR="$Sp" ./install.sh -y >/dev/null
          test "$(find "$Sp" -name SKILL.md | wc -l)" -eq 9 || { echo "a path with a space stopped working"; exit 1; }

          # An interrupted or failed swap must leave the installed skill in place.
          # `outgoing` is the only copy while the window is open, so the cleanup has
          # to restore it before sweeping - deleting it is how a failed mv turns
          # into a lost skill. Inject a failure into the mv that installs staging.
          Fi=$(mktemp -d)          # not $RUNNER_TEMP: a C:/... PATH entry is split on its colon
          mkdir -p "$Fi/bin"
          CLAUDE_SKILLS_DIR="$Fi/target" ./install.sh -y >/dev/null
          REAL_MV=$(command -v mv)
          cat > "$Fi/bin/mv" <<SHIM
          #!/bin/sh
          case "\$1" in
            *.lean-skills-staging-*)
              case "\$2" in */tdd) echo "mv: simulated failure" >&2; exit 1 ;; esac ;;
          esac
          exec $REAL_MV "\$@"
          SHIM
          sed -i.bak 's/^          //' "$Fi/bin/mv" 2>/dev/null || sed -i '' 's/^          //' "$Fi/bin/mv"
          rm -f "$Fi/bin/mv.bak"
          chmod +x "$Fi/bin/mv"
          # Assign PATH in the shell, not as a prefix on the command: bash 3.2 (the
          # macOS runner) does not let a temporary assignment reach a builtin's own
          # lookup, so `PATH=... command -v mv` still found /bin/mv -- and the guard
          # below correctly reported that this test would have measured nothing.
          OLD_PATH=$PATH
          PATH="$Fi/bin:$PATH"
          if [ "$(command -v mv)" != "$Fi/bin/mv" ]; then
            PATH=$OLD_PATH
            echo "the mv shim is not on PATH - this test would measure nothing"; exit 1
          fi
          set +e
          CLAUDE_SKILLS_DIR="$Fi/target" ./install.sh -y >"$Fi/out" 2>&1
          set -e
          PATH=$OLD_PATH
          grep -qF 'simulated failure' "$Fi/out" || { echo "the injected failure never fired"; exit 1; }
          test -f "$Fi/target/tdd/SKILL.md" || { echo "a failed swap destroyed the installed skill"; exit 1; }
          test "$(find "$Fi/target" -name SKILL.md | wc -l)" -eq 9 || { echo "a failed swap lost a skill"; exit 1; }
          test -z "$(find "$Fi/target" -maxdepth 1 -name '.lean-skills-outgoing-*')" \
            || { echo "the backup was left behind after a successful restore"; exit 1; }

          # the clean uninstall path: all ours, nothing spared, exit 0
          K="$RUNNER_TEMP/clean"
          CLAUDE_SKILLS_DIR="$K" ./install.sh -y >/dev/null
          CLAUDE_SKILLS_DIR="$K" ./install.sh --uninstall >/dev/null
          test "$(find "$K" -name SKILL.md | wc -l)" -eq 0
          test "$(find "$K" -name .lean-skills | wc -l)" -eq 0

          # a retired name must be cleared on the uninstall path too, or the
          # directory that shadows the built-in /code-review lives for ever
          Rt="$RUNNER_TEMP/retired"
          CLAUDE_SKILLS_DIR="$Rt" ./install.sh -y >/dev/null
          mkdir -p "$Rt/code-review"; : > "$Rt/code-review/SKILL.md"
          cp "$Rt/tdd/.lean-skills" "$Rt/code-review/.lean-skills"
          CLAUDE_SKILLS_DIR="$Rt" ./install.sh --uninstall >/dev/null
          test ! -e "$Rt/code-review" || { echo "uninstall left a retired skill behind"; exit 1; }

          # --uninstall --adopt must clear a marker-less tree (the ps1 leg tests
          # this; without it here the contract existed on one platform only)
          Ua="$RUNNER_TEMP/uadopt"
          for s in $(ls skills); do mkdir -p "$Ua/$s"; echo ZZ-OLD-SENTINEL-ZZ > "$Ua/$s/SKILL.md"; done
          CLAUDE_SKILLS_DIR="$Ua" ./install.sh --uninstall --adopt >/dev/null
          test "$(find "$Ua" -name SKILL.md | wc -l)" -eq 0 || { echo "--uninstall --adopt spared a marker-less tree"; exit 1; }

          # a directory that IS ours still gets a prompt: no -y and no tty must
          # not overwrite it (the earlier consent case used a marker-less dir,
          # which is refused earlier and never reaches the prompt)
          Oc="$RUNNER_TEMP/ours-consent"
          CLAUDE_SKILLS_DIR="$Oc" ./install.sh -y >/dev/null
          echo ZZ-MINE-SENTINEL-ZZ > "$Oc/tdd/SKILL.md"
          CLAUDE_SKILLS_DIR="$Oc" ./install.sh </dev/null >/dev/null 2>&1 || true
          grep -qF ZZ-MINE-SENTINEL-ZZ "$Oc/tdd/SKILL.md" || { echo "overwrote an owned skill without consent"; exit 1; }

          # the ownership marker is an exact first line, and both installers must
          # read it the same way -- a substring test claimed (and rm -rf'd) any
          # directory whose marker merely quoted the sentence
          Ms="$RUNNER_TEMP/marker-sem"
          for v in upper prefix suffix; do
            rm -rf "$Ms"; mkdir -p "$Ms/tdd"; : > "$Ms/tdd/SKILL.md"
            case $v in
              upper)  tr 'a-z' 'A-Z' < "$RUNNER_TEMP/skills/tdd/.lean-skills" > "$Ms/tdd/.lean-skills" ;;
              prefix) { printf '# '; cat "$RUNNER_TEMP/skills/tdd/.lean-skills"; } > "$Ms/tdd/.lean-skills" ;;
              suffix) sed '1s/$/ -- and more/' "$RUNNER_TEMP/skills/tdd/.lean-skills" > "$Ms/tdd/.lean-skills" ;;
            esac
            CLAUDE_SKILLS_DIR="$Ms" ./install.sh --uninstall >/dev/null 2>&1 || true
            test -f "$Ms/tdd/SKILL.md" || { echo "a $v marker was claimed as ours"; exit 1; }
          done

          # an interrupted install must not leave a directory Claude Code would
          # load as a skill of its own
          test -z "$(find "$RUNNER_TEMP" -maxdepth 3 -name '.lean-skills-outgoing-*')"

          # atomic swap kept, and no staging directory left behind
          grep -qF 'mv "$staging" "$dest_abs/$name"' install.sh
          test -z "$(find "$RUNNER_TEMP" -maxdepth 3 -name '.lean-skills-staging-*')"

          # upgrading from a version that wrote no markers must not silently no-op
          U="$RUNNER_TEMP/legacy"
          for s in $(ls skills); do mkdir -p "$U/$s"; echo ZZ-OLD-SENTINEL-ZZ > "$U/$s/SKILL.md"; done
          mkdir -p "$U/code-review" && echo ZZ-OLD-SENTINEL-ZZ > "$U/code-review/SKILL.md"   # a retired name
          set +e; CLAUDE_SKILLS_DIR="$U" ./install.sh -y >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 3 || { echo "legacy upgrade should exit 3, got $rc"; exit 1; }
          grep -qF ZZ-OLD-SENTINEL-ZZ "$U/tdd/SKILL.md" || { echo "legacy upgrade overwrote without --adopt"; exit 1; }
          CLAUDE_SKILLS_DIR="$U" ./install.sh -y --adopt >/dev/null
          if grep -qF ZZ-OLD-SENTINEL-ZZ "$U/tdd/SKILL.md"; then echo "--adopt did not take over"; exit 1; fi
          test ! -e "$U/code-review" || { echo "--adopt left the retired skill behind"; exit 1; }
          test "$(find "$U" -name .lean-skills | wc -l)" -eq "$SRC_DIRS"

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $srcFiles = (Get-ChildItem -Recurse -File skills).Count
          $srcDirs = (Get-ChildItem -Directory skills).Count
          function Assert-Install($p) {
            # each installed directory also gains one .lean-skills marker
            $want = $srcFiles + $srcDirs
            $f = (Get-ChildItem -Recurse -File -Force -LiteralPath $p).Count
            $s = (Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $p).Count
            $m = (Get-ChildItem -Recurse -Filter .lean-skills -Force -LiteralPath $p).Count
            if ($f -ne $want) { throw "expected $want files, got $f" }
            if ($s -ne 9) { throw "expected 9 SKILL.md, got $s" }
            if ($m -ne $srcDirs) { throw "expected $srcDirs markers, got $m" }
          }
          # Out-of-process, and judged by exit code: a refusal is a contract a
          # caller can branch on, and it must be the same 2 that install.sh uses.
          # Catching an exception instead would silently stop testing anything the
          # moment a refusal became an `exit` rather than a `throw`.
          function Assert-Refused($p, $op) {
            $env:CLAUDE_SKILLS_DIR = $p
            $log = Join-Path $env:RUNNER_TEMP 'refused.txt'
            # the child is expected to write to stderr; 2>&1 on a native command
            # wraps each line in a NativeCommandError, which terminates under Stop
            $prevEAP = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            if ($op -eq 'Uninstall') {
              & powershell -NoProfile -File .\install.ps1 -Uninstall > $log 2>&1
            } else {
              & powershell -NoProfile -File .\install.ps1 -Yes > $log 2>&1
            }
            $code = $LASTEXITCODE
            $ErrorActionPreference = $prevEAP
            $out = Get-Content -Raw $log -ErrorAction SilentlyContinue
            if ($code -ne 2) { throw "guard did not refuse ${p} (${op}): exit $code, want 2 -- $out" }
            if ($out -notmatch 'refusing:') { throw "no refusal message for ${p}: $out" }
            $dirty = git status --porcelain
            if ($dirty) { throw "repo dirty after ${p}: $dirty" }
          }

          $env:CLAUDE_SKILLS_DIR = Join-Path $env:RUNNER_TEMP 'skills'
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "clean install should exit 0, got $LASTEXITCODE" }
          Assert-Install $env:CLAUDE_SKILLS_DIR
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "idempotent install should exit 0, got $LASTEXITCODE" }
          Assert-Install $env:CLAUDE_SKILLS_DIR

          # no -Yes and no console: nothing may be overwritten, not even with -Adopt
          $C = Join-Path $env:RUNNER_TEMP 'consent'
          [IO.Directory]::CreateDirectory((Join-Path $C 'grill-me')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $C 'grill-me\SKILL.md'), 'ZZ-MINE-SENTINEL-ZZ')
          $env:CLAUDE_SKILLS_DIR = $C
          & powershell -NoProfile -NonInteractive -File .\install.ps1 -Adopt | Out-Null
          if (-not (Get-Content -Raw (Join-Path $C 'grill-me\SKILL.md')).Contains('ZZ-MINE-SENTINEL-ZZ')) {
            throw "-Adopt overwrote without consent"
          }
          & powershell -NoProfile -NonInteractive -File .\install.ps1 | Out-Null
          if (-not (Get-Content -Raw (Join-Path $C 'grill-me\SKILL.md')).Contains('ZZ-MINE-SENTINEL-ZZ')) {
            throw "install overwrote without consent"
          }

          # the clean uninstall path, without -Adopt, must also clear the markers
          $K = Join-Path $env:RUNNER_TEMP 'cleanps'
          $env:CLAUDE_SKILLS_DIR = $K
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          & powershell -NoProfile -File .\install.ps1 -Uninstall | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "clean uninstall should exit 0, got $LASTEXITCODE" }
          if ((Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $K -ErrorAction SilentlyContinue).Count -ne 0) { throw "SKILL.md left behind" }
          if ((Get-ChildItem -Recurse -Filter .lean-skills -Force -LiteralPath $K -ErrorAction SilentlyContinue).Count -ne 0) { throw "markers left behind" }
          if (-not (Select-String -SimpleMatch 'Move-Item -LiteralPath $staging' .\install.ps1)) { throw "the atomic swap is gone" }
          $env:CLAUDE_SKILLS_DIR = Join-Path $env:RUNNER_TEMP 'skills'

          $repo = (Get-Location).Path
          Assert-Refused (Join-Path $repo 'skills') 'Yes'
          Assert-Refused (Join-Path $repo 'skills\tdd') 'Yes'
          Assert-Refused $repo 'Yes'
          Assert-Refused (Join-Path $repo 'skills\a\b\c') 'Yes'
          # junction topologies: direct, chained, and a link on a parent component.
          # GetFullPath does not resolve reparse points, so only the write-probe catches these.
          cmd /c mklink /J "$env:RUNNER_TEMP\jroot" "$repo" | Out-Null
          cmd /c mklink /J "$env:RUNNER_TEMP\j1" "$repo\skills" | Out-Null
          cmd /c mklink /J "$env:RUNNER_TEMP\j2" "$env:RUNNER_TEMP\j1" | Out-Null
          foreach ($op in @('Yes','Uninstall')) {
            Assert-Refused "$env:RUNNER_TEMP\jroot\skills" $op
            Assert-Refused "$env:RUNNER_TEMP\j1" $op
            Assert-Refused "$env:RUNNER_TEMP\j2" $op
          }
          # a link on a *parent* component: the target lands inside the source,
          # which a marker written into the target cannot detect
          Assert-Refused "$env:RUNNER_TEMP\j1\sub" 'Yes'
          Assert-Refused "$env:RUNNER_TEMP\j1\x\y" 'Yes'
          # junction to the repo root: the source sits inside the target, which a
          # canary planted in the source can never reveal by walking upward
          foreach ($op in @('Yes','Uninstall')) { Assert-Refused "$env:RUNNER_TEMP\jroot" $op }

          # Windows drops empty environment variables, so the set-but-empty case
          # install.sh guards against cannot occur here — asserted, not assumed.
          $env:CLAUDE_SKILLS_DIR = ''
          if (Test-Path Env:\CLAUDE_SKILLS_DIR) { throw "Windows kept an empty env var; install.ps1 needs the guard install.sh has" }

          $T = Join-Path $env:RUNNER_TEMP 'skills dir'
          $env:CLAUDE_SKILLS_DIR = $T
          .\install.ps1 -Yes | Out-Null; Assert-Install $T
          [IO.Directory]::CreateDirectory((Join-Path $T 'not-ours')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $T 'not-ours\SKILL.md'), '')
          # a skill of the user's that happens to share one of our names
          Remove-Item -Recurse -Force -LiteralPath (Join-Path $T 'tdd')
          [IO.Directory]::CreateDirectory((Join-Path $T 'tdd')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $T 'tdd\SKILL.md'), 'ZZ-USER-SENTINEL-ZZ')
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "install keeping a user skill should exit 3, got $LASTEXITCODE" }
          if (-not (Get-Content -Raw -LiteralPath (Join-Path $T 'tdd\SKILL.md')).Contains('ZZ-USER-SENTINEL-ZZ')) {
            throw "install clobbered a user-owned same-named skill"
          }
          # uninstall now exits 3 when it spares something it cannot claim
          & powershell -NoProfile -File .\install.ps1 -Uninstall | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "uninstall sparing a user skill should exit 3, got $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $T 'not-ours\SKILL.md'))) { throw "uninstall removed a foreign skill" }
          if (-not (Get-Content -Raw -LiteralPath (Join-Path $T 'tdd\SKILL.md')).Contains('ZZ-USER-SENTINEL-ZZ')) {
            throw "uninstall removed a user-owned same-named skill"
          }
          $left = (Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $T).Count
          if ($left -ne 2) { throw "uninstall left $left SKILL.md, want 2 (both theirs)" }
          # parity with the bash leg: --Adopt, retired names, and the legacy upgrade
          $U = Join-Path $env:RUNNER_TEMP 'legacy'
          $skillNames = @(Get-ChildItem -Directory skills | ForEach-Object { $_.Name })
          foreach ($n in $skillNames) {
            [IO.Directory]::CreateDirectory((Join-Path $U $n)) | Out-Null
            [IO.File]::WriteAllText((Join-Path $U ($n + '\SKILL.md')), 'ZZ-OLD-SENTINEL-ZZ')
          }
          [IO.Directory]::CreateDirectory((Join-Path $U 'code-review')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $U 'code-review\SKILL.md'), 'ZZ-OLD-SENTINEL-ZZ')
          $env:CLAUDE_SKILLS_DIR = $U
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "legacy upgrade should exit 3, got $LASTEXITCODE" }
          if (-not (Get-Content -Raw (Join-Path $U 'tdd\SKILL.md')).Contains('ZZ-OLD-SENTINEL-ZZ')) { throw "overwrote without -Adopt" }
          & powershell -NoProfile -File .\install.ps1 -Yes -Adopt | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "-Adopt should succeed, got $LASTEXITCODE" }
          if ((Get-Content -Raw (Join-Path $U 'tdd\SKILL.md')).Contains('ZZ-OLD-SENTINEL-ZZ')) { throw "-Adopt did not take over" }
          if (Test-Path -LiteralPath (Join-Path $U 'code-review')) { throw "-Adopt left the retired skill behind" }
          $m = (Get-ChildItem -Recurse -Filter .lean-skills -Force -LiteralPath $U).Count
          if ($m -ne $skillNames.Count) { throw "expected $($skillNames.Count) markers after adopt, got $m" }
          & powershell -NoProfile -File .\install.ps1 -Uninstall -Adopt | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uninstall -Adopt should exit 0, got $LASTEXITCODE" }
          if ((Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $U -ErrorAction SilentlyContinue).Count -ne 0) {
            throw "uninstall -Adopt left skills behind"
          }

          # a foreign marker is not ours; a non-directory at our name is not ours
          $F = Join-Path $env:RUNNER_TEMP 'foreign'
          [IO.Directory]::CreateDirectory((Join-Path $F 'implement')) | Out-Null
          [IO.File]::WriteAllText((Join-Path $F 'implement\.lean-skills'), 'someone elses marker')
          [IO.File]::WriteAllText((Join-Path $F 'implement\SKILL.md'), 'ZZ-FOREIGN-SENTINEL-ZZ')
          [IO.File]::WriteAllText((Join-Path $F 'worktree'), 'a plain file at our name')
          $env:CLAUDE_SKILLS_DIR = $F
          & powershell -NoProfile -File .\install.ps1 -Yes | Out-Null
          if ($LASTEXITCODE -ne 3) { throw "foreign marker / non-directory should block, got $LASTEXITCODE" }
          if (-not (Get-Content -Raw (Join-Path $F 'implement\SKILL.md')).Contains('ZZ-FOREIGN-SENTINEL-ZZ')) { throw "a foreign marker was accepted as ours" }
          # a sentinel that the shipped text could ever contain is a dead assertion
          foreach ($s in @('ZZ-FOREIGN-SENTINEL-ZZ','ZZ-USER-SENTINEL-ZZ','ZZ-OLD-SENTINEL-ZZ','ZZ-MINE-SENTINEL-ZZ')) {
            if (Get-ChildItem skills -Recurse -File | Select-String -SimpleMatch $s) {
              throw "sentinel $s collides with shipped text"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $F 'worktree') -PathType Leaf)) { throw "destroyed a non-directory at our name" }

          # install.sh grew a symlink-aware existence test; the same blindness was
          # left in install.ps1, where Test-Path also answers about a link's target
          if ((Get-Content -Raw .\install.ps1) -notmatch 'function Test-Exists') {
            throw "install.ps1 has no symlink-aware existence test"
          }
          if ((Get-Content -Raw .\install.ps1) -match 'Test-Path -LiteralPath \$target') {
            throw "install.ps1 still decides about the user's property with Test-Path"
          }

          # IsPathRooted says yes to `C:relative` (relative to the current directory
          # *on drive C:*) and to a single leading separator (relative to the current
          # drive). Neither is a path the caller named.
          foreach ($bad in @('C:relative-target', ([char]92 + 'single-leading'))) {
            $env:CLAUDE_SKILLS_DIR = $bad
            $prevEAP = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
            & powershell -NoProfile -File .\install.ps1 -Yes *> $null
            $rc = $LASTEXITCODE
            $ErrorActionPreference = $prevEAP
            if ($rc -ne 2) { throw "drive-relative '$bad' should exit 2, got $rc" }
          }
          $env:CLAUDE_SKILLS_DIR = $null

          # the same exit-code contract as install.sh - a caller cannot branch on
          # "it refused" if the two platforms answer differently
          # these calls are supposed to fail; suspend Stop so a native command's
          # stderr does not become a terminating NativeCommandError
          function Get-Exit($block) {
            $prev = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $block *> $null
            $code = $LASTEXITCODE
            $ErrorActionPreference = $prev
            return $code
          }
          $env:CLAUDE_SKILLS_DIR = 'rel\x'
          if ((Get-Exit { & powershell -NoProfile -File .\install.ps1 -Yes }) -ne 2) { throw "relative path should exit 2" }
          $env:CLAUDE_SKILLS_DIR = (Join-Path (Get-Location) 'skills')
          if ((Get-Exit { & powershell -NoProfile -File .\install.ps1 -Yes }) -ne 2) { throw "target=source should exit 2" }
          $env:CLAUDE_SKILLS_DIR = $null
          if ((Get-Exit { & powershell -NoProfile -File .\install.ps1 -Bogus }) -ne 2) { throw "unknown option should exit 2" }
          $env:CLAUDE_SKILLS_DIR = Join-Path $env:RUNNER_TEMP 'never-made'
          if ((Get-Exit { & powershell -NoProfile -File .\install.ps1 -Uninstall }) -ne 0) { throw "uninstall on a missing target should exit 0" }
          $env:CLAUDE_SKILLS_DIR = $null

          # A failed swap must not destroy the installed skill. A function shadows
          # a cmdlet, so a fake Move-Item intercepts the script's calls; dot-source
          # install.ps1 in a child process because its `exit` would end this one.
          $Fi = Join-Path $env:RUNNER_TEMP 'faultinj'
          New-Item -ItemType Directory -Force $Fi | Out-Null
          Copy-Item -Recurse .\skills (Join-Path $Fi 'skills')
          Copy-Item .\install.ps1 (Join-Path $Fi 'install.ps1')
          $FiT = Join-Path $Fi 'target'
          $env:CLAUDE_SKILLS_DIR = $FiT
          & powershell -NoProfile -File (Join-Path $Fi 'install.ps1') -Yes | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "fault-injection baseline install failed" }
          $inj = @'
          param([string]$Target, [string]$Script)
          function Move-Item {
            param([string]$LiteralPath, [string]$Destination)
            if ($LiteralPath -like '*staging*' -and $Destination -like '*\tdd') { throw "simulated failure" }
            Microsoft.PowerShell.Management\Move-Item -LiteralPath $LiteralPath -Destination $Destination
          }
          $env:CLAUDE_SKILLS_DIR = $Target
          . $Script -Yes
          '@ -replace '(?m)^          ', ''
          $injPath = Join-Path $Fi 'inject.ps1'
          [IO.File]::WriteAllText($injPath, $inj)
          # 2>&1 on a native command wraps each stderr line in a NativeCommandError,
          # which terminates under ErrorActionPreference = 'Stop'. The child is
          # *expected* to write to stderr here, so relax it around the call.
          $prevEAP = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $out = & powershell -NoProfile -File $injPath $FiT (Join-Path $Fi 'install.ps1') 2>&1 | Out-String
          $ErrorActionPreference = $prevEAP
          if ($out -notmatch 'simulated failure') { throw "the injected failure never fired" }
          if (-not (Test-Path -LiteralPath (Join-Path $FiT 'tdd\SKILL.md'))) {
            throw "a failed swap destroyed the installed skill"
          }
          $kept = @(Get-ChildItem $FiT -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'SKILL.md') }).Count
          if ($kept -ne 9) { throw "a failed swap lost a skill: $kept of 9 left" }
          if (@(Get-ChildItem $FiT -Filter '.lean-skills-outgoing-*' -Force).Count -ne 0) {
            throw "the backup was left behind after a successful restore"
          }

          # a relative target is refused and writes nothing
          $env:CLAUDE_SKILLS_DIR = 'rel-here'
          if ((Get-Exit { & powershell -NoProfile -File .\install.ps1 -Yes }) -ne 2) {
            throw "relative CLAUDE_SKILLS_DIR was accepted"
          }
          if (Test-Path -LiteralPath (Join-Path $repo 'rel-here')) { throw "wrote into a relative path" }

          # the script must parse, including branches this run never enters
          $perr = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$null, [ref]$perr)
          if ($perr) { throw "install.ps1 parse errors: $($perr -join '; ')" }

          # The same state matrix install_matrix.sh runs against install.sh. These
          # children write to stderr by design, and 2>&1 on a native command under
          # ErrorActionPreference=Stop becomes a terminating NativeCommandError.
          $prevEAP = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          # $LASTEXITCODE, not faith: a native command that fails does NOT stop a
          # PowerShell script, so before 0.17.7 this line printed
          # "fatal: invalid object name 'v0.12.0'." into a green leg and the gate
          # below compared against an empty file. The log said fatal; the run
          # said success.
          $fxRepo = if ($env:LEAN_FIXTURE_REPO) { $env:LEAN_FIXTURE_REPO } else { "." }
          git -C $fxRepo show v0.12.0:install.ps1 | Out-File -FilePath "$env:RUNNER_TEMP\old.ps1" -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "CI GATE BROKEN: cannot read install.ps1 from v0.12.0 - this fixture is what proves the installer matrix rejects v0.12.0"
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\old.ps1") -or (Get-Item "$env:RUNNER_TEMP\old.ps1").Length -eq 0) {
            throw "CI GATE BROKEN: v0.12.0:install.ps1 came back empty - this fixture is what proves the installer matrix rejects v0.12.0"
          }
          Write-Output "fixture ok: v0.12.0:install.ps1 -> the installer matrix must reject v0.12.0"

          # Both interpreters, because they are not the same language: 5.1 and
          # pwsh 7 differ on native-command redirection, on -LiteralPath, and on
          # what Test-Path says about a link whose target is gone. The installer
          # ships to users of both, so a green on one proves nothing about the other.
          foreach ($sh in @('powershell', 'pwsh')) {
            if (-not (Get-Command $sh -ErrorAction SilentlyContinue)) {
              # On a GitHub runner both interpreters are present, so a missing one
              # is a broken image, not a limitation -- fail rather than quietly
              # halve the coverage. Off CI (a developer box without pwsh 7) say so
              # loudly instead; a silent skip is what this whole release is about.
              if ($env:CI) { throw "$sh is not on PATH; this runner cannot prove the installer works under it" }
              Write-Host "  SKIP  $sh is not installed here; its leg was NOT run"
              continue
            }
            & $sh -NoProfile -File ./tests\install_matrix.ps1 > "$env:RUNNER_TEMP\ps-$sh.log" 2>&1
            $mrc = $LASTEXITCODE
            $tail = (Get-Content "$env:RUNNER_TEMP\ps-$sh.log" | Where-Object { $_ -match 'passed,' } | Select-Object -Last 1)
            Write-Host "$sh -> $tail"
            if ($mrc -ne 0) { Get-Content "$env:RUNNER_TEMP\ps-$sh.log" | Select-Object -Last 20; throw "the installer matrix failed under $sh" }
            # A skip is not a pass. Windows runners have Developer Mode on, so
            # the symlink cases must genuinely execute here.
            if ($tail -notmatch '^28 passed, 0 failed, 0 skipped$') {
              throw "$sh ran '$tail'; expected 28 passed, 0 failed, 0 skipped"
            }
            # ...and a version that used to fail must still fail under this
            # interpreter too, or the matrix has stopped detecting anything
            & $sh -NoProfile -File ./tests\install_matrix.ps1 "$env:RUNNER_TEMP\old.ps1" > "$env:RUNNER_TEMP\psold-$sh.log" 2>&1
            if ($LASTEXITCODE -eq 0) { throw "v0.12.0 passes the installer matrix under $sh; it should not" }
          }
          $ErrorActionPreference = $prevEAP

          $dirty = git status --porcelain
          if ($dirty) { throw "repo dirty at end: $dirty" }

      - name: shellcheck
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Pinned. The runner image ships 0.9.0 today and that is not a stable
          # interface: a linter whose rule set moves under you either starts
          # failing on unchanged code or quietly stops catching things. This
          # version is also what `pip install shellcheck-py` gives locally, so
          # the gate a developer runs is the gate CI runs.
          SC_VER=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          SC="$RUNNER_TEMP/shellcheck-v${SC_VER}/shellcheck"
          "$SC" --version
          "$SC" --version | grep -qx "version: ${SC_VER}" \
            || { echo "shellcheck is not the pinned ${SC_VER}"; exit 1; }
          shellcheck() { "$SC" "$@"; }
          # The recipe blocks are production code: a model runs them over the
          # user's uncommitted work. They must be clean with no exclusions.
          # This is not theoretical - v0.17.0 shipped `git diff --binary --
          # $(tr ...)` unquoted, which word-split every tracked path containing
          # a space straight out of the patch. 41 matrix cases missed it;
          # shellcheck reports it as SC2046 on the line itself.
          M=skills/resolving-merge-conflicts/SKILL.md
          for b in park restore; do
            awk -v tag="# lean-skills:$b" '
              $0 ~ /^ *```/ { if (inb) { inb=0 }; next }
              index($0, tag) { inb=1 }
              inb { sub(/^   /, ""); print }
            ' "$M" > "$RUNNER_TEMP/$b.sh"
            test -s "$RUNNER_TEMP/$b.sh" || { echo "could not extract the $b block"; exit 1; }
            shellcheck -s bash "$RUNNER_TEMP/$b.sh"
          done
          # ...and this check must be able to fail. Feed it the v0.17.0 block
          # and require a finding, or a broken extractor would lint an empty
          # file and pass for the rest of time.
          sh tests/fixture.sh v0.17.0 "$M" "$RUNNER_TEMP/old.md" \
            "shellcheck must reject v0.17.0's park block"
          if [ -s "$RUNNER_TEMP/old.md" ]; then
            awk -v tag="# lean-skills:park" '
              $0 ~ /^ *```/ { if (inb) { inb=0 }; next }
              index($0, tag) { inb=1 }
              inb { sub(/^   /, ""); print }
            ' "$RUNNER_TEMP/old.md" > "$RUNNER_TEMP/old-park.sh"
            if shellcheck -s bash "$RUNNER_TEMP/old-park.sh" >/dev/null 2>&1; then
              echo "shellcheck passes v0.17.0's park block; it must not"; exit 1
            fi
          fi
          # install.sh, minus one false positive: `CDPATH= cd -- ...` is a
          # deliberate command-prefix assignment, not an attempt to set a var.
          shellcheck -s sh -e SC1007 install.sh
          # fixture.sh is POSIX sh too, and it is the single point every RED gate
          # now depends on - a fault in it disarms all seven at once.
          shellcheck -s sh tests/fixture.sh
          # The test scripts, minus the idioms they are built on: SC2016 because
          # the rollback anchors are literal shell text handed to python and must
          # not expand; SC1091 because the sourced recipe only exists at run time;
          # SC2086 on $args because splitting it into flags is the point.
          # parking_property.sh is linted here but not RUN in CI: it is slow and
          # random, so a red needs its seed replayed before it means anything.
          # It is a pre-release leg (README's release checklist, step 8).
          shellcheck -s bash -e SC2016,SC1091,SC2086,SC2012 \
            tests/parking_matrix.sh tests/parking_rollback.sh tests/install_matrix.sh tests/parking_crash.sh \
            tests/parking_property.sh
          echo "shellcheck: recipe blocks clean with no exclusions; v0.17.0 still rejected"

      - name: manifests and frontmatter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'EOF'
          import io, json, os, re
          for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json'):
              json.load(io.open(p, encoding='utf-8'))
          resident, manual = [], []
          for d in sorted(os.listdir('skills')):
              assert os.path.isdir(f'skills/{d}'), f'stray file in skills/: {d}'
              text = io.open(f'skills/{d}/SKILL.md', encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
              assert m, f'{d}: no frontmatter'
              fm = m.group(1)
              name = re.search(r'^name:\s*(\S+)', fm, re.M)
              assert name and name.group(1) == d, f'{d}: name/dir mismatch'
              desc = re.search(r'^description:\s*(\S.*)$', fm, re.M)
              assert desc, f'{d}: description is missing or empty'
              # a resident skill is reachable only through its description, so an
              # empty or one-word one silently removes it from the model's reach
              if not re.search(r'^disable-model-invocation:\s*true', fm, re.M):
                  assert len(desc.group(1).split()) >= 8, f'{d}: resident description too thin to trigger on'
              (manual if re.search(r'^disable-model-invocation:\s*true', fm, re.M)
                      else resident).append(d)
          RESIDENT = {'verification-before-completion', 'receiving-code-review',
                      'diagnosing-bugs', 'spec-review'}
          # resolving-merge-conflicts is manual as of 0.17.0: it drives a
          # destructive recipe over the user's uncommitted work, so it is not
          # something the model may reach for on its own reading of a description
          MANUAL   = {'grill-me', 'implement', 'tdd', 'worktree',
                      'resolving-merge-conflicts'}
          assert set(resident) == RESIDENT, ('resident set changed', sorted(resident))
          assert set(manual) == MANUAL, ('manual set changed', sorted(manual))
          assert len(resident) == 4 and len(manual) == 5, (resident, manual)
          # the ownership marker's first line is a cross-version contract: change it
          # and every existing install becomes unclaimable
          MARKER = 'installed by lean-skills; uninstall removes only directories carrying this file'
          for path in ('install.sh', 'install.ps1'):
              assert MARKER in io.open(path, encoding='utf-8').read(), f'{path}: the ownership marker line changed'
          # No NUL byte in a file that is supposed to be text. One slipped into
          # CHANGELOG.md while documenting `tr -d -c '\000'`, and git promptly
          # started reporting the file as binary - no diff, no review.
          for d, _, fs in os.walk('.'):
              if '.git' in d.split(os.sep):
                  continue
              for f in fs:
                  q = os.path.join(d, f)
                  if os.path.splitext(f)[1] not in ('.md', '.json', '.yml', '.sh', '.ps1', '.py'):
                      continue
                  if b'\x00' in io.open(q, 'rb').read():
                      raise AssertionError(f'{q} contains a NUL byte; git will treat it as binary')
          assert 'code-review' not in resident + manual, 'never shadow the built-in /code-review'
          plugin = json.load(io.open('.claude-plugin/plugin.json', encoding='utf-8'))
          mk = json.load(io.open('.claude-plugin/marketplace.json', encoding='utf-8'))
          p0 = mk['plugins'][0]
          total = len(resident) + len(manual)
          blurb = f'{total} skills, {len(resident)} resident'
          # bounded on the left too: '19 skills, 5 resident' contains the substring
          # '9 skills, 5 resident' and used to pass
          for d in (plugin['description'], p0['description']):
              assert re.search(r'(?<!\d)' + re.escape(blurb), d), (blurb, d)
          # the two manifests must describe the same plugin, from this repository
          assert plugin['name'] == p0['name'], ('name drift', plugin['name'], p0['name'])
          src = p0.get('source')
          url = src if isinstance(src, str) else (src or {}).get('url', '')
          assert 'zhoukaichaoaa/lean-skills' in url, f'marketplace points somewhere else: {url}'
          # Pin the plugin to the tag being released, not to whatever main holds:
          # `source` supports `ref` (branch or tag) and `sha`. Tags here are
          # immutable by rule, so a ref pin is as reproducible as a sha and does
          # not need the commit to exist before the file that names it.
          ref = (src or {}).get('ref') if isinstance(src, dict) else None
          assert ref == 'v' + plugin['version'], \
              f'marketplace pins {ref!r}, but this release is v{plugin["version"]}'
          assert plugin['version'] == p0['version'] == mk['metadata']['version'], 'version drift'
          ver = plugin['version']
          # a `## ` heading, not a mention: renaming the heading to
          # '## Unreleased (would have been 0.11.0)' left the version in the prose
          # and silently switched off the NOTICE-coverage loop below as well
          changelog = io.open('CHANGELOG.md', encoding='utf-8').read()
          assert re.search(r'(?m)^## ' + re.escape(ver) + r'(?![\d.])', changelog), \
              f'CHANGELOG has no "## {ver}" section'
          # a resident skill must not be advertised on the manual line, or vice versa
          # What the installer prints is the only bucket map most users ever read.
          # Compare it for equality, not membership: a heuristic that only looked
          # at hyphenated names could not see an invented `tdd` or a dropped one.
          import re as _re
          for path in ('install.sh', 'install.ps1'):
              blob = io.open(path, encoding='utf-8').read()
              lines = blob.splitlines()
              def strip_scaffold(s):
                  return _re.sub(r'^(echo|Write-Host)\s*', '', s.strip()).strip().strip('"')
              i_r = [i for i, l in enumerate(lines) if 'Resident (model-invoked):' in l]
              i_m = [i for i, l in enumerate(lines) if 'Manual (user-invoked):' in l]
              assert len(i_r) == 1 and len(i_m) == 1, f'{path}: the banner is not printed exactly once'
              i_r, i_m = i_r[0], i_m[0]
              assert i_m > i_r, f'{path}: the banner lines are out of order'
              r_part = ' '.join(strip_scaffold(l) for l in lines[i_r:i_m]).partition('Resident (model-invoked):')[2]
              m_part = strip_scaffold(lines[i_m]).partition('Manual (user-invoked):')[2]
              got_r = {w for w in _re.split(r'[,\s]+', r_part) if w}
              got_m = {w for w in _re.split(r'[,\s]+', m_part) if w}
              assert got_r == RESIDENT, f'{path}: resident line says {sorted(got_r)}'
              assert got_m == MANUAL, f'{path}: manual line says {sorted(got_m)}'
          # Attribution rots quietly: before this check, six of nine footnotes
          # carried no version at all and three named one up to five releases
          # behind what had actually changed. The rule that stops it is single
          # truth - NOTICE carries the per-release record, the footnote carries
          # what the file is relative to upstream and a pointer here.
          UPSTREAM = {'diagnosing-bugs': 'mattpocock', 'grill-me': 'mattpocock',
                      'implement': 'mattpocock', 'tdd': 'mattpocock',
                      'resolving-merge-conflicts': 'mattpocock', 'spec-review': 'mattpocock',
                      'receiving-code-review': 'obra', 'worktree': 'obra',
                      'verification-before-completion': 'obra'}
          notice_body = io.open('NOTICE.md', encoding='utf-8').read()
          for d in sorted(os.listdir('skills')):
              body = io.open(f'skills/{d}/SKILL.md', encoding='utf-8').read()
              assert '\n_' in body, f'{d}: no attribution footnote'
              foot = body[body.rindex('\n_'):]
              assert UPSTREAM[d] in foot, f'{d}: the footnote does not name its upstream'
              assert '(MIT)' in foot, f'{d}: the footnote does not state the licence'
              assert 'NOTICE.md' in foot, f'{d}: the footnote does not point at the per-release record'
              # a version number in a footnote is a second changelog, and the
              # second copy is the one that goes stale
              stale = re.findall(r'(?<!Claude Code )\b\d+\.\d+\.\d+\b', foot)
              assert not stale, f'{d}: footnote carries version numbers {stale}; that record belongs in NOTICE'
              # ...and NOTICE must carry exactly one row for the file
              rows = [l for l in notice_body.splitlines() if l.startswith(f'| `skills/{d}/SKILL.md`')]
              assert len(rows) == 1, f'{d}: NOTICE has {len(rows)} rows for it, want exactly 1'
          # NOTICE quotes a word count for every rewritten skill. It has drifted
          # in five separate releases, so the file is now checked, not trusted.
          notice = io.open('NOTICE.md', encoding='utf-8').read()
          # The count is whitespace-separated tokens, NOT `wc -w`: wc's answer moves
          # with the locale (851 vs 877 for the same file) and differs between GNU
          # and BSD, so a number written under one is unverifiable under the other.
          assert "awk '{n+=NF}END{print n}'" in notice, 'NOTICE no longer states how the counts are taken'
          convention = notice.split('## 逐文件')[1].split('| 本仓库文件')[0]
          assert '不用 `wc -w`' in convention, 'NOTICE dropped the reason wc -w is not the convention'
          claims = {
              'skills/verification-before-completion/SKILL.md': r'580 . (\d+) .',
              'skills/receiving-code-review/SKILL.md':          r'913 . (\d+) .',
              'skills/worktree/SKILL.md':                       r'1069 . (\d+) .',
              'skills/spec-review/SKILL.md':                    r'1104 . \S+ (\d+) .',
          }
          for path, pat in claims.items():
              m = re.search(pat, notice)
              assert m, f'NOTICE no longer states a word count for {path}'
              stated = int(m.group(1))
              actual = len(io.open(path, encoding='utf-8').read().split())
              assert stated == actual, f'NOTICE says {stated} words for {path}, actual {actual}'
          # every arrow in the table must be one of the four checked above: a fifth
          # one would be a number nothing recomputes
          arrows = re.findall(r'(\d+) → (?:本仓库 )?(\d+) 词', notice)
          assert len(arrows) == 4, f'unchecked word-count arrows in NOTICE: {arrows}'
          # every shipped version must have said something about what it changed
          # tuple-of-ints, not string order: '10' < '8' lexically, which would have
          # silently stopped checking at 0.10.0
          for v in re.findall(r'^## (\d+\.\d+\.\d+)', changelog, re.M):
              if tuple(int(x) for x in v.split('.')) >= (0, 8, 0):
                  assert v in notice, f'NOTICE never mentions {v}, but CHANGELOG ships it'
          print('ok: 9 skills,', len(resident), 'resident,', len(manual), 'manual; installer lists and NOTICE counts agree')
          EOF

      - name: spec-review's diff recipe captures every change class
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Anchor on the skill text: if the recipe in SKILL.md changes, this test
          # must be revisited rather than silently keep testing a stale command.
          S=skills/spec-review/SKILL.md
          grep -q 'git merge-base --all <base-ref> HEAD' "$S"
          grep -q 'git diff <that-literal-sha>' "$S"
          grep -q 'git log <that-literal-sha>..HEAD --oneline' "$S"
          # -uall, not a bare --porcelain: the default folds an untracked
          # directory into one `dir/` line and never names the files in it, so a
          # whole new module reads as one word. Measured: three files under
          # src/newfeature/ print as `?? src/`.
          grep -q 'git status --porcelain --untracked-files=all' "$S"
          grep -q 'printed SHA' "$S"

          R="$RUNNER_TEMP/fixture"; rm -rf "$R"; git init -q "$R"; cd "$R"
          git config user.email ci@ci; git config user.name ci
          printf 'base\n' > kept.txt; printf 'gone\n' > gone.txt; printf 'old\n' > old-name.txt
          git add -A; git commit -qm base
          BASE_SHA=$(git merge-base HEAD HEAD)
          printf 'committed-change\n' >> kept.txt; git commit -aqm feature
          printf 'staged-content\n' > staged.txt; git add staged.txt
          printf 'unstaged-change\n' >> kept.txt
          printf 'untracked-content\n' > 'un tracked.txt'
          git rm -q gone.txt
          git mv old-name.txt new-name.txt
          PATCH=$(git diff "$BASE_SHA")
          STATUS=$(git status --porcelain)
          grep -q 'committed-change' <<<"$PATCH"
          grep -q 'staged-content' <<<"$PATCH"
          grep -q 'unstaged-change' <<<"$PATCH"
          grep -q 'gone.txt' <<<"$PATCH"
          grep -q 'new-name.txt' <<<"$PATCH"
          grep -q 'un tracked.txt' <<<"$STATUS"
          # A single untracked file at the root is visible either way. An
          # untracked *directory* is where the default hides the change: git
          # prints one `src/` line and never names what is under it, so a whole
          # new module reads as one word. Both halves are asserted, so if git
          # ever stops collapsing, this fixture says so instead of going quiet.
          mkdir -p src/newfeature/deep
          printf 'a\n' > src/newfeature/a.py
          printf 'b\n' > src/newfeature/deep/b.py
          printf 'c\n' > src/newfeature/deep/c.py
          if grep -q 'newfeature' <<<"$(git status --porcelain)"; then
            echo "fixture no longer shows --porcelain collapsing an untracked directory"; exit 1
          fi
          UALL=$(git status --porcelain --untracked-files=all)
          grep -q 'src/newfeature/a.py' <<<"$UALL"
          grep -q 'src/newfeature/deep/b.py' <<<"$UALL"
          grep -q 'src/newfeature/deep/c.py' <<<"$UALL"
          # The skill warns that an empty base silently degrades `git diff <BASE_SHA>`
          # into an unstaged-only diff. Prove it on a file that is *only* staged —
          # unlike a modified file, it cannot leak in as diff context.
          if grep -qx 'staged.txt' <<<"$(git diff ${UNSET_ON_PURPOSE:-} --name-only)"; then
            echo "empty-base diff should NOT see staged files"; exit 1
          fi
          # ...but the real base does see it
          grep -qx 'staged.txt' <<<"$(git diff "$BASE_SHA" --name-only)"
          # and that a bad fixed point fails loudly rather than silently
          git merge-base "$BASE_SHA" HEAD >/dev/null
          if git merge-base HEAD 0000000000000000000000000000000000000000 >/dev/null 2>&1; then
            echo "expected merge-base against a bogus ref to fail"; exit 1
          fi
          # Criss-crossed merges: two branches that each merged the other's
          # EARLIER tip leave two equally valid merge bases. Bare `merge-base`
          # answers with one of them and says nothing, and the two choices
          # disagree about whose work the change contains -- measured below, a
          # file branch A introduced reads as B's work under one baseline and is
          # absent under the other. The old tips must be named by SHA: merging
          # the current tips collapses this to a single base.
          C="$RUNNER_TEMP/crisscross"; rm -rf "$C"; git init -q "$C"; cd "$C"
          git config user.email ci@ci; git config user.name ci
          printf 'r\n' > root.txt; git add -A; git commit -qm root
          ROOT=$(git rev-parse HEAD)
          git checkout -qb A; printf 'a1\n' > a.txt; git add -A; git commit -qm a1
          A_OLD=$(git rev-parse HEAD)
          git checkout -qb B "$ROOT"
          printf 'b1\n' > b.txt; git add -A; git commit -qm b1
          B_OLD=$(git rev-parse HEAD)
          git checkout -q A; git merge -q --no-edit -m mergeB "$B_OLD"
          git checkout -q B; git merge -q --no-edit -m mergeA "$A_OLD"
          git checkout -q A; printf 'a2\n' > a2.txt; git add -A; git commit -qm a2
          git checkout -q B; printf 'b2\n' > b2.txt; git add -A; git commit -qm b2
          N_BASES=$(git merge-base --all A HEAD | grep -c .)
          test "$N_BASES" -eq 2 \
            || { echo "fixture no longer produces two merge bases (got $N_BASES)"; exit 1; }
          test "$(git merge-base A HEAD | grep -c .)" -eq 1 \
            || { echo "bare merge-base no longer answers with exactly one base"; exit 1; }
          FIRST=$(git merge-base --all A HEAD | sed -n 1p)
          SECOND=$(git merge-base --all A HEAD | sed -n 2p)
          test "$(git diff --name-only "$FIRST")" != "$(git diff --name-only "$SECOND")" \
            || { echo "fixture no longer shows the two baselines disagreeing"; exit 1; }
          # and concretely: a.txt is A's commit, yet exactly one baseline
          # attributes it to B
          A_SEEN=0
          grep -qx a.txt <<<"$(git diff --name-only "$FIRST")" && A_SEEN=$((A_SEEN + 1))
          grep -qx a.txt <<<"$(git diff --name-only "$SECOND")" && A_SEEN=$((A_SEEN + 1))
          test "$A_SEEN" -eq 1 \
            || { echo "expected a.txt under exactly one baseline, got $A_SEEN"; exit 1; }
          echo "diff recipe: all change classes visible; degradation modes confirmed"

      - name: git recipes in the skills actually run
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          M=skills/resolving-merge-conflicts/SKILL.md
          S=skills/spec-review/SKILL.md
          # Anchors must sit inside a prescriptive code block, not anywhere in the
          # file: a reversed instruction that keeps the literal string nearby
          # would otherwise pass. Extract the fenced bash blocks first.
          # any fenced block, whatever it is labelled: relabelling ```bash to ```sh
          # used to lift a recipe out of every check below
          awk '/^ *```/{f=!f; next} f' "$M" > "$RUNNER_TEMP/mc-cmds.txt"
          awk '/^ *```/{f=!f; next} f' "$S" > "$RUNNER_TEMP/sr-cmds.txt"
          # separate statements: in `A && B`, set -e exempts A, so half of a
          # combined test can fail without failing the step
          test -s "$RUNNER_TEMP/mc-cmds.txt"
          test -s "$RUNNER_TEMP/sr-cmds.txt"
          for want in 'merge-base --all HEAD <that head>' 'REBASE_HEAD^<n> REBASE_HEAD'                       'CHERRY_PICK_HEAD^<n> CHERRY_PICK_HEAD' 'REVERT_HEAD^<n> REVERT_HEAD'                       'rev-list --parents -n 1' 'show-toplevel' 'git diff --binary --' 'git apply --3way' 'git checkout -- ":(literal,top)$p"' 'git restore --staged -- ":(literal,top)$p"' 'done < "$PARK/tracked"' 'done < "$G/lean-park-input"' 'left in place, untracked and untouched' 'name-status -M' 'MERGE_HEAD"'                       'hash-object -t tree'; do
            grep -qF "$want" "$RUNNER_TEMP/mc-cmds.txt" || { echo "not prescribed in a code block: $want"; exit 1; }
          done
          for want in 'cat-file -e' 'refs/heads/<default>:refs/remotes/origin/<default>' 'ls-remote --symref' '--json state,baseRefName' 'merge-base --all <base-ref> HEAD' '--untracked-files=all' 'refs/pull/<number>/head' '"<baseRefOid>^{commit}"'; do
            # `--` because several of these wants start with a dash and grep
            # would otherwise read them as its own options
            grep -qF -- "$want" "$RUNNER_TEMP/sr-cmds.txt" || { echo "not prescribed in a code block: $want"; exit 1; }
          done
          # every prescribed git command that prints paths must disable octal escaping
          path_cmds=$(grep -E '^ *git .*(--name-only|--name-status|--porcelain)' "$RUNNER_TEMP/mc-cmds.txt" || true)
          # an exact count, not a floor: with `-ge 6` the four recipes that carry
          # this skill (index diff, porcelain, the step 9 evidence pair) could all
          # be deleted and the step stayed green
          n_path=$(grep -c . <<<"$path_cmds")
          test "$n_path" -eq 10 || { echo "expected 10 path-printing recipes, found $n_path"; echo "$path_cmds"; exit 1; }
          unquoted=$(grep -vF -- '-c core.quotePath=false' <<<"$path_cmds" || true)
          test -z "$unquoted" || { echo "lost core.quotePath=false:"; echo "$unquoted"; exit 1; }
          # a bare `git stash push` here would be step 4's own trap in a new
          # command: the paths it names were just untracked, and a single
          # untracked path fails the whole command rather than skipping it
          # `git stash` cannot park work during a rebase: a stash records the whole
          # index, so it carries the conflict resolution, replays it after the rebase
          # and manufactures a fresh conflict - and popping mid-rebase fails outright.
          # Every prescribed command that consumes a path printed by status must say
          # :(literal,top). `top` because status prints repo-root-relative paths and a
          # bare path resolves against the current directory, so from a subdirectory
          # `git diff` returns 0 with an empty patch while restore/checkout exit 1 and
          # leave the work staged. `literal` because status also prints names like
          # a[1].txt, and git matches a pathspec both literally and as a wildcard:
          # measured, `restore --staged -- ':(top)a[1].txt'` unstages a1.txt too and
          # exits 0, while `checkout --` over a conflicted a1.txt is rejected whole.
          consumers=$(grep -E "^ *git (restore --staged|checkout|diff --binary) " "$RUNNER_TEMP/mc-cmds.txt" || true)
          test -n "$consumers" || { echo "the path-consuming recipes vanished"; exit 1; }
          notop=$(grep -v ":(literal,top)" <<<"$consumers" || true)
          test -z "$notop" || { echo "a path-consuming recipe lost its :(literal,top):"; echo "$notop"; exit 1; }
          # ...and the pathspecs handed to the patch must be built the same way,
          # NUL-terminated so they never pass through word splitting: v0.17.0
          # joined them with an unquoted $(...) and lost every path with a space
          grep -qF "printf ':(literal,top)%s\\0'" "$RUNNER_TEMP/mc-cmds.txt" \
            || { echo "the parked pathspecs are no longer built as NUL-terminated :(literal,top)"; exit 1; }
          grep -qF 'xargs -0 git diff --binary --' "$RUNNER_TEMP/mc-cmds.txt" \
            || { echo "the patch no longer takes its pathspecs over NUL"; exit 1; }
          # GNU-only spellings that leave the recipe broken on macOS. `xargs -a`
          # made every parking case fail there with "invalid option -- a"; BSD
          # dirname takes no options at all, so `dirname --` eats the `--`.
          # comments stripped first: this file explains these very spellings, and
          # matching the explanation instead of the code is its own dead assertion
          grep -vE '^ *#' "$RUNNER_TEMP/mc-cmds.txt" > "$RUNNER_TEMP/mc-code.txt"
          test -s "$RUNNER_TEMP/mc-code.txt"
          # regexes, not fixed strings: v0.17.0 spelled it `xargs -0 -a`, so a
          # literal "xargs -a" would have sailed straight past the very bug that
          # prompted this check
          # each of these was verified to match v0.17.0's recipe and not this one;
          # a pattern that matches neither is a dead assertion and does not belong
          for gnuism in 'xargs( +-[^ ]+)* +-a\b' 'dirname +--'; do
            if grep -qE -- "$gnuism" "$RUNNER_TEMP/mc-code.txt"; then
              echo "the recipe matches /$gnuism/, which is not portable to BSD/macOS:"
              grep -nE -- "$gnuism" "$RUNNER_TEMP/mc-code.txt"; exit 1
            fi
          done
          # ...and the recipe must refuse to apply an empty patch
          grep -qF 'if [ -s "$PARK/tracked.patch" ]; then' "$RUNNER_TEMP/mc-cmds.txt" \
            || { echo "the empty-patch guard is gone"; exit 1; }
          # ...and stand at the top before reading any of those paths
          grep -qF 'cd "$(git rev-parse --show-toplevel)"' "$RUNNER_TEMP/mc-cmds.txt" \
            || { echo "the skill no longer moves to the worktree root"; exit 1; }

          stash_cmds=$(grep -E '^ *git stash' "$RUNNER_TEMP/mc-cmds.txt" || true)
          test -z "$stash_cmds" || { echo "the skill prescribes git stash again:$stash_cmds"; exit 1; }
          # ...and neither can `cp`: a copy cannot carry a deletion, a rename, a mode
          # or two same-named files from different directories
          cp_cmds=$(grep -E '^ *cp ' "$RUNNER_TEMP/mc-cmds.txt" || true)
          test -z "$cp_cmds" || { echo "the skill parks with cp again:$cp_cmds"; exit 1; }

          # prose-level anchors: these are warnings, not commands, so they live
          # outside the fenced blocks the loop above checks
          grep -qF 'Never fall back to `@{upstream}`' "$S"
          grep -qF 'baseRefOid' "$S"
          # 0.17.6's audit batch. Each sentence below is the only thing standing
          # between the recipe and a measured failure it used to walk into, and
          # none of them is a command, so the fenced-block loop cannot see them.
          for want in 'require `OPEN`' \
                      'no git remotes found' \
                      '--is-shallow-repository' \
                      'git fetch --unshallow' \
                      'not a statement separator in PowerShell' \
                      'single** bare value is the base ref' \
                      'multiple merge bases; the diff baseline is ambiguous' \
                      'truncated side is **`HEAD`**' \
                      'on its own and reading its exit code'; do
            grep -qF -- "$want" "$S" || { echo "prose anchor gone from $S: $want"; exit 1; }
          done
          # The fenced blocks have to stay runnable when the caller is driving
          # PowerShell, which the installer supports on Windows. Measured on
          # 5.1: `||` is a *parse*-time error, so the line never runs and no
          # `try` catches it; and an unquoted `^{commit}` is read as a script
          # block, so git exits 129 and an object that IS present reads as
          # missing. A bare `--deepen` is not a flag either (exit 129).
          for bad in '||' '--deepen ' '--deepen"'; do
            if grep -qF -- "$bad" "$RUNNER_TEMP/sr-cmds.txt"; then
              echo "not portable to PowerShell / not a valid flag, as a prescribed command: $bad"; exit 1
            fi
          done
          if grep -qE '\-\-deepen$' "$RUNNER_TEMP/sr-cmds.txt"; then
            echo "bare --deepen at end of line is back as a prescribed command"; exit 1
          fi
          if grep -qE 'cat-file -e [^"]*\^\{commit\}' "$RUNNER_TEMP/sr-cmds.txt"; then
            echo "the ^{commit} argument lost its quotes; PowerShell reads it as a script block"; exit 1
          fi
          # and what they must never say again - each of these shipped as a bug once
          for bad in 'diff --name-only HEAD MERGE_HEAD' 'diff --name-status -M HEAD MERGE_HEAD' 'diff --cached --name-only HEAD'; do
            if grep -qF "$bad" "$M"; then echo "retired mistake is back in $M: $bad"; exit 1; fi
          done
          # These must not reappear as *instructions*. The guard sentence above
          # contains `@{upstream}` too, so look only inside the fenced blocks --
          # the earlier version ANDed in "unless the warning is present", which
          # the line above had already made unconditionally true, so it never fired.
          for bad in 'baseRepository' '@{upstream}'; do
            if grep -qF "$bad" "$RUNNER_TEMP/sr-cmds.txt"; then
              echo "retired mistake is back as a prescribed command: $bad"; exit 1
            fi
          done
          if grep -qF 'baseRepository' "$S"; then echo "baseRepository is not a gh field"; exit 1; fi

          new_repo() {
            rm -rf "$1"; git init -q "$1"; cd "$1"
            git config user.email ci@ci; git config user.name ci
            echo base > f.txt; echo base > side.txt
            git add -A; git commit -qm base
            git checkout -qb feat; echo theirs > f.txt; git commit -aqm theirs
            git checkout -q master 2>/dev/null || git checkout -q main
            echo mine > f.txt; echo ours-only > side.txt; git commit -aqm mine
          }

          new_repo "$RUNNER_TEMP/r-merge"
          git merge feat >/dev/null 2>&1 || true
          BASE=$(git merge-base HEAD MERGE_HEAD)
          test -n "$BASE" || { echo "merge-base printed nothing on a normal merge"; exit 1; }
          BRINGS=$(git diff --name-only "$BASE" MERGE_HEAD)
          test "$BRINGS" = "f.txt" || { echo "merge brings [$BRINGS], want f.txt"; exit 1; }
          if ! grep -q side.txt <<<"$(git diff --name-only HEAD MERGE_HEAD)"; then
            echo "fixture no longer shows why HEAD..MERGE_HEAD is the wrong range"; exit 1
          fi
          echo user > staged.txt; git add staged.txt
          echo more >> side.txt
          echo note > untracked.txt
          USERS=$(comm -23 <(git diff --cached --name-only HEAD | sort) <(echo "$BRINGS" | sort))
          test "$USERS" = "staged.txt" || { echo "user set [$USERS], want staged.txt"; exit 1; }
          git restore --staged -- $USERS
          if git restore --staged -- untracked.txt 2>/dev/null; then
            echo "expected git restore --staged to reject an untracked path"; exit 1
          fi
          echo resolved > f.txt; git add f.txt; git commit -qm merged
          grep -qx f.txt <<<"$(git show --name-only --format= HEAD)"
          if grep -q staged.txt <<<"$(git show --name-only --format= HEAD)"; then
            echo "the user's staged file landed in the merge commit"; exit 1
          fi
          grep -q '^?? untracked.txt' <<<"$(git status --porcelain)"
          grep -q '^ M side.txt' <<<"$(git status --porcelain)"

          # unrelated histories: merge-base prints nothing, and an empty base must not
          # be substituted into the diff - it would compare against the working tree
          rm -rf "$RUNNER_TEMP/r-unrel"; git init -q "$RUNNER_TEMP/r-unrel"; cd "$RUNNER_TEMP/r-unrel"
          git config user.email ci@ci; git config user.name ci
          echo a > shared.txt; echo a > a-only.txt; git add -A; git commit -qm A
          git checkout -q --orphan other; git rm -rqf .
          echo b > shared.txt; echo b > b-only.txt; git add -A; git commit -qm B
          git checkout -q master 2>/dev/null || git checkout -q main
          git merge --allow-unrelated-histories other >/dev/null 2>&1 || true
          if git merge-base HEAD MERGE_HEAD >/dev/null 2>&1; then
            echo "fixture no longer shows the unrelated-histories case"; exit 1
          fi
          EMPTYTREE=$(git hash-object -t tree /dev/null)
          BRINGS=$(git diff --name-only "$EMPTYTREE" MERGE_HEAD | sort | tr -s '[:space:]' ',' | sed 's/,$//')
          test "$BRINGS" = "b-only.txt,shared.txt" || { echo "empty-tree base brings [$BRINGS]"; exit 1; }
          COLLAPSED=$(git diff --name-only MERGE_HEAD | sort | tr -s '[:space:]' ',' | sed 's/,$//')
          test "$COLLAPSED" != "$BRINGS" || { echo "fixture no longer shows why a collapsed base is wrong"; exit 1; }

          new_repo "$RUNNER_TEMP/r-cp"
          git cherry-pick feat >/dev/null 2>&1 || true
          test -f "$(git rev-parse --git-dir)/CHERRY_PICK_HEAD"
          grep -qx f.txt <<<"$(git diff --name-only CHERRY_PICK_HEAD^ CHERRY_PICK_HEAD)"
          if git diff --name-only REBASE_HEAD^ REBASE_HEAD >/dev/null 2>&1; then
            echo "REBASE_HEAD resolved during a cherry-pick; the per-operation split is moot"; exit 1
          fi

          # a rename gives only the new path under --name-only; -M gives both
          new_repo "$RUNNER_TEMP/r-mv"
          git merge feat >/dev/null 2>&1 || true
          git mv side.txt renamed.txt
          if grep -qx side.txt <<<"$(git diff --cached --name-only HEAD)"; then
            echo "fixture no longer shows --name-only hiding the old path"; exit 1
          fi
          grep -q 'side.txt' <<<"$(git diff --cached --name-status -M HEAD)"

          new_repo "$RUNNER_TEMP/r-up"
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git remote add origin "$RUNNER_TEMP/origin.git"
          git push -q origin HEAD:main
          git checkout -qb feature; echo w > w.txt; git add -A; git commit -qm w
          git push -q -u origin feature
          test "$(git merge-base HEAD '@{upstream}')" = "$(git rev-parse HEAD)"
          test -z "$(git diff --name-only "$(git merge-base HEAD '@{upstream}')")"
          git merge-base HEAD origin/main >/dev/null
          # ...and the PARTLY pushed case, which is the one that does not look
          # broken. An empty diff is conspicuous; this one is not. Push a commit,
          # add another on top, and @{upstream} yields a non-empty and entirely
          # plausible diff that silently omits the work already pushed - so the
          # report reads as complete while covering only the tail of the change.
          printf 'p1\n' > p1.txt; git add -A; git commit -qm pushed1
          git push -q origin feature
          printf 'u1\n' > u1.txt; git add -A; git commit -qm unpushed1
          UP_BASE=$(git merge-base HEAD '@{upstream}')
          test "$UP_BASE" != "$(git rev-parse HEAD)"
          UP_DIFF=$(git diff --name-only "$UP_BASE")
          test -n "$UP_DIFF" \
            || { echo "fixture no longer shows @{upstream} giving a non-empty partial diff"; exit 1; }
          grep -qx u1.txt <<<"$UP_DIFF"
          if grep -qx p1.txt <<<"$UP_DIFF"; then
            echo "fixture no longer shows @{upstream} hiding already-pushed work"; exit 1
          fi
          # the real base sees both halves
          TRUE_DIFF=$(git diff --name-only "$(git merge-base HEAD origin/main)")
          grep -qx p1.txt <<<"$TRUE_DIFF"
          grep -qx u1.txt <<<"$TRUE_DIFF"

          # a PR's baseRefName is a branch name, not a usable ref
          git push -q origin HEAD:dev
          git fetch -q origin
          if git rev-parse --verify dev >/dev/null 2>&1; then
            echo "fixture no longer shows that a bare base branch name may not resolve"; exit 1
          fi
          git rev-parse --verify refs/remotes/origin/dev >/dev/null
          git merge-base refs/remotes/origin/dev HEAD >/dev/null
          echo "git recipes: merge range, restore split, per-operation refs and base selection all behave as documented"

      - name: parking recipes, driven from SKILL.md itself
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # These extract the marked blocks from SKILL.md and run them, so the
          # document is what is under test - not a copy of it in the test.
          # A skipped case reads like a passing one in a total. Linux and macOS
          # can both hold a newline and a tab in a name and can both make real
          # symlinks, so here every case must actually run: a skip means a probe
          # regressed, not that the platform is limited.
          bash tests/parking_matrix.sh | tee "$RUNNER_TEMP/pm.log"
          grep -qE '[0-9]+ passed, 0 failed, 0 skipped' "$RUNNER_TEMP/pm.log" \
            || { echo "the parking matrix skipped cases; on this platform none may be"; exit 1; }
          # ...and the count itself, so a case that quietly stops being generated
          # cannot hide inside "0 failed"
          grep -qE '^42 passed, 0 failed, 0 skipped' "$RUNNER_TEMP/pm.log" \
            || { echo "expected 42 parking cases; the matrix shrank or grew"; exit 1; }
          # ...and the cases that carry the awkward names by name, because a count
          # stays right while a case quietly turns into a duplicate of an easy one.
          # These are exactly the ones a broken capability probe drops first.
          for c in newlinepath tabpath globpath spacepath dashpath utf8path \
                   symlink brokenlink linkmixed; do
            for w in root sub; do
              grep -qxF "  ok    $c / $w" "$RUNNER_TEMP/pm.log" \
                || { echo "the parking matrix never passed a case named '$c / $w'"; exit 1; }
            done
          done
          # The standalone cases, named rather than counted - each carries evidence
          # no state name can: that a half-finished park is recoverable, that
          # :(literal) keeps a glob-shaped name away from a conflicted file, that a
          # collapsed directory entry is refused, that an abort does not take the
          # rescued work with it, that a parent turned symlink cannot move a file
          # out of the repository, and that a leaf which is a link to a directory is
          # parked rather than mistaken for one.
          for c in "glob name beside a conflicted file" "input list is not NUL-separated" "abandoned after parking" "untracked directory via step 3's own command"; do
            grep -qxF "  ok    $c" "$RUNNER_TEMP/pm.log" \
              || { echo "the parking matrix never passed the case '$c'"; exit 1; }
          done
          # ...and a recipe that used to be broken must still be caught, or the
          # matrix has stopped discriminating. v0.17.0 built its pathspecs with
          # `xargs -a` (which BSD xargs rejects) and joined them with an unquoted
          # $(...) (which splits a tracked path on its spaces). Both faults are on
          # the tracked side, which 0.17.5 kept, so this fixture still bites.
          for old in v0.17.0; do
            sh tests/fixture.sh "$old" skills/resolving-merge-conflicts/SKILL.md \
              "$RUNNER_TEMP/old-$old.md" "the parking matrix must reject $old's recipe"
            if bash tests/parking_matrix.sh "$RUNNER_TEMP/old-$old.md" >/dev/null 2>&1; then
              echo "$old's recipe passes the parking matrix; it should not"; exit 1
            fi
          done
          # Cheap first: every rollback anchor must resolve to exactly one line
          # of the current recipe. The suite enforces this anyway, but each
          # check costs a full matrix run, so a stale anchor otherwise surfaces
          # an hour in. Anchors have gone stale in four releases of this repo.
          python3 tests/check_anchors.py
          # SIGKILL at every step of park. The matrix cannot see this class at
          # all - measured: reverting the fix below leaves the matrix entirely
          # green while the crash suite drops four cases. Its injection is a real
          # SIGKILL because a catchable signal would be eaten by a trap, and a
          # clean early exit would run handlers a crash never runs.
          bash tests/parking_crash.sh | tee "$RUNNER_TEMP/crash.log"
          grep -qE '^[0-9]+ passed, 0 failed, [0-9]+ skipped' "$RUNNER_TEMP/crash.log" \
            || { echo "the crash suite reported failures"; exit 1; }
          # It must also be able to fail, or a broken extractor would report a
          # clean sweep of nothing. v0.17.2's restore reads $PARK/manifest,
          # which park writes *after* each move, so a kill in that window left
          # the file parked, unlisted and never returned - with restore exiting
          # 0. That released version is the fixture: no in-line rewriting, and
          # it stays honest even if the current wording moves.
          # "It went red" is NOT enough, and 0.17.7 is why. A clause in
          # check_invariant looks like dead code against HEAD - 0.17.5 stopped
          # creating $PARK/untracked, so it walks a path that is not there - and
          # deleting it left the current recipe at an unchanged 37/0/8. But
          # against v0.17.2 that directory exists and the clause is live: with it
          # gone this RED drops from 4 failed to 2, losing the move/manifest
          # window itself. The old gate only asked "did it fail?", so the RED
          # could halve in silence. Pin the names.
          #
          # `passed` and `skipped` are deliberately NOT pinned: how many
          # injection points parse is a bash-version property and may differ
          # between the Linux and macOS runners. The failure names cannot.
          for old in v0.17.2; do
            sh tests/fixture.sh "$old" skills/resolving-merge-conflicts/SKILL.md \
              "$RUNNER_TEMP/old-$old.md" "the crash suite must fail on $old by 4 named kills"
            rc=0
            bash tests/parking_crash.sh "$RUNNER_TEMP/old-$old.md" > "$RUNNER_TEMP/red-$old.log" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "the crash suite passes $old, whose restore trusts the manifest; it must not"
              exit 1
            fi
            grep -qE '^[0-9]+ passed, 4 failed, [0-9]+ skipped' "$RUNNER_TEMP/red-$old.log" \
              || { echo "$old RED changed strength; expected exactly 4 failures:"; tail -3 "$RUNNER_TEMP/red-$old.log"; exit 1; }
            for want in 'killed after line 30' 'killed after line 31' 'killed after line 69' 'killed mid-move'; do
              grep -qF "FAIL  $want" "$RUNNER_TEMP/red-$old.log" \
                || { echo "$old RED no longer catches: $want"; exit 1; }
            done
          done

          # The property test is not run in full here - it is slow and random, and
          # a random red means nothing until its seed is replayed. Its two REDs
          # are not random though: fixed seed, fixed target version, fixed wording.
          # So they are pinned, and this is also the only place the property test
          # runs on anything but the author's Windows box.
          sh tests/fixture.sh v0.17.0 skills/resolving-merge-conflicts/SKILL.md \
            "$RUNNER_TEMP/pp-0170.md" "the property test must catch v0.17.0's word-split"
          sh tests/fixture.sh v0.17.2 skills/resolving-merge-conflicts/SKILL.md \
            "$RUNNER_TEMP/pp-0172.md" "the property test must catch v0.17.2's manifest defect under crash"
          rc=0
          bash tests/parking_property.sh -n 12 -s 1000 -k "$RUNNER_TEMP/pp-0170.md" > "$RUNNER_TEMP/pp-red1.log" 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { echo "the property test passes v0.17.0, whose diff word-splits paths with spaces; it must not"; exit 1; }
          grep -qF 'tree differs from before and NO state file points at anything' "$RUNNER_TEMP/pp-red1.log" \
            || { echo "v0.17.0 RED changed its reason:"; tail -5 "$RUNNER_TEMP/pp-red1.log"; exit 1; }
          rc=0
          bash tests/parking_property.sh -n 30 -s 7000 -c -k "$RUNNER_TEMP/pp-0172.md" > "$RUNNER_TEMP/pp-red2.log" 2>&1 || rc=$?
          [ "$rc" -ne 0 ] || { echo "the property test passes v0.17.2 under crash injection; it must not"; exit 1; }
          # `\./.+` and not just the wording: the first version of that clause
          # used `rev`, which MSYS does not have, so the path came out empty and
          # the check reported every changed file as a violation. It was red for
          # the wrong reason and looked identical to a real red. A named path is
          # the difference.
          grep -qE 'held \./.+ while its path in the tree was free' "$RUNNER_TEMP/pp-red2.log" \
            || { echo "v0.17.2 crash RED changed its reason, or reports an empty path:"; tail -5 "$RUNNER_TEMP/pp-red2.log"; exit 1; }
          # ...and the same seeds must be GREEN on the current recipe. A harness
          # that fails everything is red for free and proves nothing.
          bash tests/parking_property.sh -n 12 -s 1000 > "$RUNNER_TEMP/pp-green1.log" 2>&1 \
            || { echo "the property test fails the CURRENT recipe on the v0.17.0 seeds:"; tail -5 "$RUNNER_TEMP/pp-green1.log"; exit 1; }
          bash tests/parking_property.sh -n 30 -s 7000 -c > "$RUNNER_TEMP/pp-green2.log" 2>&1 \
            || { echo "the property test fails the CURRENT recipe on the v0.17.2 crash seeds:"; tail -5 "$RUNNER_TEMP/pp-green2.log"; exit 1; }
          # ...and each fix, rolled back, must turn the matrix red. Two guards
          # are excluded by name in that suite's own notes and say why: the
          # directory entry guard is unreachable from a legal input list, and
          # the parent-symlink protection is two overlapping layers that only
          # go red when both are removed, which is how that case rolls them.
          bash tests/parking_rollback.sh | tee "$RUNNER_TEMP/rb.log"
          # On Linux nothing may be skipped: GNU mv permutes its options, so the
          # one platform-conditional rollback can and must run here. macOS is
          # allowed exactly one skip - BSD mv stops scanning at the first
          # operand, so that vector cannot be built there at all.
          if [ "$RUNNER_OS" = Linux ]; then
            grep -qF '(0 skipped)' "$RUNNER_TEMP/rb.log" \
              || { echo "a rollback was skipped on Linux, where none may be"; exit 1; }
          fi

      - name: installer state matrix, driven from the real install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # the installer replaces and deletes directories the user owns, so it
          # gets the same treatment: real script, full tree comparison, fault
          # injection at the swap, and the versions that used to fail must fail
          bash tests/install_matrix.sh | tee "$RUNNER_TEMP/im.log"
          grep -qE '^21 passed, 0 failed, 0 skipped' "$RUNNER_TEMP/im.log" \
            || { echo "expected 21 installer cases, none skipped"; exit 1; }
          for old in v0.12.0 v0.13.1; do
            sh tests/fixture.sh "$old" install.sh "$RUNNER_TEMP/old-$old.sh" \
              "the installer matrix must reject $old's install.sh"
            if bash tests/install_matrix.sh "$RUNNER_TEMP/old-$old.sh" >/dev/null 2>&1; then
              echo "$old passes the installer matrix; it should not"; exit 1
            fi
          done

      - name: worktree and plan-path recipes actually run
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          W=skills/worktree/SKILL.md
          grep -qF 'WTDIR=.worktrees' "$W"
          grep -qF 'git check-ignore -q "$WTDIR/$BRANCH"' "$W"
          grep -qF 'git rev-parse --is-inside-work-tree' "$W"
          grep -qF 'git worktree remove' "$W"

          R="$RUNNER_TEMP/r-wt"; rm -rf "$R"; git init -q "$R"; cd "$R"
          git config user.email ci@ci; git config user.name ci
          echo x > f.txt; git add -A; git commit -qm base

          # the skill says: test a path INSIDE the directory, because a pattern
          # ending in / cannot match a path that does not exist yet
          BRANCH=fix-thing
          WTDIR=.worktrees
          echo "$WTDIR/" >> "$(git rev-parse --git-common-dir)/info/exclude"
          if git check-ignore -q "$WTDIR"; then
            echo "fixture no longer shows the directory-itself false negative"; exit 1
          fi
          git check-ignore -q "$WTDIR/$BRANCH"

          # and the mismatch the WTDIR variable exists to prevent
          if git check-ignore -q "worktrees/$BRANCH"; then
            echo "a differently-named directory was somehow already ignored"; exit 1
          fi

          git worktree add -q "$WTDIR/$BRANCH" -b "$BRANCH"
          test -z "$(git status --porcelain)" || { echo "the worktree was not ignored"; exit 1; }

          # the plan path must resolve to the main checkout from inside the worktree
          mkdir -p "$(git rev-parse --git-common-dir)/../.plans"
          echo "# plan" > "$(git rev-parse --git-common-dir)/../.plans/$BRANCH.md"
          cd "$WTDIR/$BRANCH"
          test ! -e .plans || { echo "fixture is wrong: an untracked .plans entered the worktree"; exit 1; }
          test -f "$(git rev-parse --git-common-dir)/../.plans/$BRANCH.md"             || { echo "the plan path does not resolve from inside a worktree"; exit 1; }
          cd "$R"

          # teardown, and the two loud failures the skill relies on
          if git worktree remove "$WTDIR/nope" 2>/dev/null; then
            echo "removing a non-worktree should fail"; exit 1
          fi
          git worktree remove "$WTDIR/$BRANCH"
          test ! -e "$WTDIR/$BRANCH"

          # outside a repository, the Step 0 gate must not read as a normal checkout
          mkdir -p "$RUNNER_TEMP/not-a-repo"; cd "$RUNNER_TEMP/not-a-repo"
          if [ "$(git rev-parse --is-inside-work-tree 2>/dev/null || true)" = "true" ]; then
            echo "the non-repository gate does not hold"; exit 1
          fi
          echo "worktree recipes: ignore gate, WTDIR consistency, plan path across a worktree, teardown"

      - name: completion-scope and remote-object recipes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          M=skills/resolving-merge-conflicts/SKILL.md
          S=skills/spec-review/SKILL.md
          grep -qF 'rebase-merge/onto' "$M"
          grep -qF 'sequencer/head' "$M"
          grep -qF 'diff --name-only HEAD^<n> HEAD' "$M"
          grep -qF 'git cat-file -e' "$S"
          grep -qF 'refs/heads/<default>:refs/remotes/origin/<default>' "$S"
          if grep -qF 'git rev-parse ORIG_HEAD)' "$M"; then echo "ORIG_HEAD is back as the boundary"; exit 1; fi

          seed() {
            rm -rf "$1"; git init -q "$1"; cd "$1"
            git config user.email ci@ci; git config user.name ci
            echo base > f.txt; git add -A; git commit -qm c0
            git checkout -qb feat; echo theirs > f.txt; git commit -aqm feat1
            git checkout -q master 2>/dev/null || git checkout -q main
            echo mine > f.txt; git commit -aqm mine
          }

          # single cherry-pick: ORIG_HEAD does not exist, HEAD is the boundary
          seed "$RUNNER_TEMP/s-cp"
          BOUND=$(git rev-parse HEAD)
          git cherry-pick feat >/dev/null 2>&1 || true
          if git rev-parse ORIG_HEAD >/dev/null 2>&1; then
            echo "fixture no longer shows cherry-pick leaving ORIG_HEAD unset"; exit 1
          fi
          echo wip > user.txt
          echo resolved > f.txt; git add f.txt
          git -c core.editor=true cherry-pick --continue >/dev/null 2>&1
          grep -qx f.txt <<<"$(git log --name-only --oneline "$BOUND..HEAD")"
          grep -q 'user.txt' <<<"$(git status --porcelain -- user.txt)"

          # rebase onto a base that already carries other commits
          seed "$RUNNER_TEMP/s-rb"
          git checkout -q feat; echo u > user-wip.txt; git add -A; git commit -qm userwork
          git checkout -q master 2>/dev/null || git checkout -q main
          echo extra > onbase.txt; git add -A; git commit -qm already-on-base
          git checkout -q feat
          git rebase master >/dev/null 2>&1 || git rebase main >/dev/null 2>&1 || true
          ONTO=$(cat .git/rebase-merge/onto 2>/dev/null || cat .git/rebase-apply/onto 2>/dev/null)
          test -n "$ONTO" || { echo "no onto recorded during rebase"; exit 1; }
          echo resolved > f.txt; git add f.txt
          git -c core.editor=true rebase --continue >/dev/null 2>&1
          grep -q user-wip.txt <<<"$(git log --name-only --oneline "$ONTO..HEAD")"
          if grep -qx onbase.txt <<<"$(git log --name-only --oneline "$ONTO..HEAD")"; then
            echo "the onto boundary still sweeps in commits already on the base"; exit 1
          fi
          OH=$(git rev-parse ORIG_HEAD)
          test -n "$OH" || { echo "rebase left no ORIG_HEAD to contrast with"; exit 1; }
          if ! grep -qx onbase.txt <<<"$(git log --name-only --oneline "$OH..HEAD")"; then
            echo "fixture no longer shows why ORIG_HEAD is the wrong boundary"; exit 1
          fi

          # merge: first-parent diff is what the merge landed on our side
          seed "$RUNNER_TEMP/s-mg"
          git merge feat >/dev/null 2>&1 || true
          echo wip > user.txt
          echo resolved > f.txt; git add f.txt; git commit -qm merged
          grep -qx f.txt <<<"$(git diff --name-only HEAD^1 HEAD)"
          grep -q 'user.txt' <<<"$(git status --porcelain -- user.txt)"

          # revert
          seed "$RUNNER_TEMP/s-rv"
          BOUND=$(git rev-parse HEAD)
          git revert --no-edit HEAD >/dev/null 2>&1 || true
          test -f .git/REVERT_HEAD || { echo "revert did not conflict as expected"; git revert --abort 2>/dev/null || true; }
          if [ -f .git/REVERT_HEAD ]; then
            echo resolved > f.txt; git add f.txt
            git -c core.editor=true revert --continue >/dev/null 2>&1
            grep -qx f.txt <<<"$(git log --name-only --oneline "$BOUND..HEAD")"
          fi

          # ls-remote resolves a name but downloads nothing
          B="$RUNNER_TEMP/s-rem"; rm -rf "$B"; mkdir -p "$B"; cd "$B"
          git init -q --bare origin.git
          git init -q src; cd src; git config user.email ci@ci; git config user.name ci
          echo a > f.txt; git add -A; git commit -qm base; git branch -M main
          git remote add origin ../origin.git; git push -q origin main
          git checkout -qb feature; echo b >> f.txt; git commit -aqm work; git push -q origin feature
          git checkout -q main; echo only > m.txt; git add -A; git commit -qm main-only; git push -q origin main
          cd "$B"; git --git-dir=origin.git symbolic-ref HEAD refs/heads/main
          git clone -q --single-branch --branch feature "file://$B/origin.git" sc
          cd sc
          DEF=$(git ls-remote --symref origin HEAD | awk '/^ref:/{sub("refs/heads/","",$2); print $2}')
          test "$DEF" = main || { echo "ls-remote gave [$DEF]"; exit 1; }
          SHA=$(git ls-remote origin "refs/heads/$DEF" | cut -f1)
          if git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "fixture no longer shows ls-remote leaving the object absent"; exit 1
          fi
          git fetch -q origin "+refs/heads/$DEF:refs/remotes/origin/$DEF"
          git cat-file -e "$SHA^{commit}"
          git merge-base "refs/remotes/origin/$DEF" HEAD >/dev/null
          echo "completion scope: per-operation boundaries hold; ls-remote needs the fetch the skill now prescribes"

      - name: platform parity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Every contract must be asserted on both Windows and macOS. A step
          # gated to one platform is a contract only that platform has.
          # Allowed exceptions are listed here by name, with the reason.
          python3 - <<'EOF'
          import io, yaml
          allowed = {
              'install.ps1': 'PowerShell only exists on Windows',
              'manifests and frontmatter': 'parses files; no platform surface',
              'shellcheck': 'a static linter; its findings do not vary by platform',
              'official plugin validation (strict)': 'installs an npm package; one platform is enough',
              'platform parity': 'this check itself',
          }
          wf = yaml.safe_load(io.open('.github/workflows/ci.yml', encoding='utf-8'))
          # The premise of this whole check is that the matrix still runs on the
          # three platforms. Deleting macos-latest, or excluding it, used to leave
          # the guard printing "these run on macOS as well" over a matrix that
          # had no macOS in it.
          strat = wf['jobs']['install'].get('strategy', {})
          mx = strat.get('matrix', {})
          assert set(mx.get('os', [])) == {'ubuntu-latest', 'macos-latest', 'windows-latest'}, \
              f'the platform matrix changed: {mx.get("os")}'
          assert not mx.get('exclude'), f'matrix excludes combinations: {mx.get("exclude")}'
          # Every job, not just this one: a second job full of Linux-only steps
          # was entirely outside the guard's view.
          for jname, job in wf['jobs'].items():
              if jname == 'install':
                  continue
              for s in job.get('steps', []):
                  cond = (s.get('if') or '').strip()
                  assert not cond, f'job {jname} step "{s.get("name")}" is conditional: {cond}'
          steps = wf['jobs']['install']['steps']
          # an exemption for a step that no longer exists is one a future step
          # could inherit by name without anyone deciding to
          stale = set(allowed) - {s.get('name') for s in steps}
          assert not stale, f'allowed list names steps that do not exist: {sorted(stale)}'
          bad = []
          names = [s.get('name') for s in steps if s.get('name')]
          assert len(names) == len(set(names)), f'duplicate step names: {names}'
          for idx, s in enumerate(steps):
              if 'run' not in s:          # checkout and other actions
                  continue
              name = s.get('name') or f'<unnamed step #{idx}>'
              if name in allowed:
                  continue
              cond = (s.get('if') or '').strip()
              if cond and cond != "runner.os != 'Windows'":
                  bad.append((name, cond))
              # a step that cannot fail the job is a step that asserts nothing
              if s.get('continue-on-error'):
                  bad.append((name, 'continue-on-error: true'))
              # ...and neither is one that returns early on a platform
              body = s.get('run') or ''
              for probe in ('uname', '$OSTYPE', 'RUNNER_OS', 'runner.os'):
                  for line in body.splitlines():
                      ls = line.strip()
                      if probe in ls and ('exit 0' in ls or 'return 0' in ls):
                          bad.append((name, f'body short-circuits by platform: {ls[:60]}'))
          if bad:
              for n, c in bad:
                  print(f'step "{n}" is gated to one platform: if: {c}')
              print('Gate it with  if: runner.os != Windows  so macOS runs it too,')
              print('or add the step to the allowed list above with a reason.')
              raise SystemExit(1)
          covered = [s.get('name') for s in steps
                     if s.get('name') and s.get('name') not in allowed]
          print('platform parity: these run on macOS as well as Linux ->', ', '.join(covered))
          EOF

      - name: official plugin validation (strict)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@2.1.220
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json

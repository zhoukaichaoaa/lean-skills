name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: install.sh (fresh, overwrite, guards, uninstall)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if grep -q $'\r' install.sh; then echo "CRLF found in install.sh"; exit 1; fi
          test -x install.sh
          sh -n install.sh
          export CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills"
          ./install.sh -y
          test "$(find "$CLAUDE_SKILLS_DIR" -name SKILL.md | wc -l)" -eq 9
          ./install.sh -y
          test "$(find "$CLAUDE_SKILLS_DIR" -name SKILL.md | wc -l)" -eq 9
          # guard: target equal to (or inside) the source must refuse, leaving the source intact
          if CLAUDE_SKILLS_DIR="$PWD/skills" ./install.sh -y >/dev/null 2>&1; then
            echo "guard failed: src==dest accepted"; exit 1
          fi
          if CLAUDE_SKILLS_DIR="$PWD/skills/tdd" ./install.sh -y >/dev/null 2>&1; then
            echo "guard failed: dest inside src accepted"; exit 1
          fi
          test -f skills/tdd/SKILL.md
          # spaces in the target path
          CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills dir" ./install.sh -y >/dev/null
          test "$(find "$RUNNER_TEMP/skills dir" -name SKILL.md | wc -l)" -eq 9
          # uninstall removes exactly ours
          CLAUDE_SKILLS_DIR="$RUNNER_TEMP/skills dir" ./install.sh --uninstall >/dev/null
          test "$(find "$RUNNER_TEMP/skills dir" -name SKILL.md | wc -l)" -eq 0

      - name: install.ps1 (fresh, overwrite, guards, uninstall)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          $env:CLAUDE_SKILLS_DIR = Join-Path $env:RUNNER_TEMP 'skills'
          .\install.ps1 -Yes
          $n = (Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $env:CLAUDE_SKILLS_DIR).Count
          if ($n -ne 9) { throw "expected 9 SKILL.md, got $n" }
          .\install.ps1 -Yes
          $n = (Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $env:CLAUDE_SKILLS_DIR).Count
          if ($n -ne 9) { throw "expected 9 SKILL.md after overwrite, got $n" }
          # guard: target equal to the source must refuse, leaving the source intact
          $failed = $false
          $env:CLAUDE_SKILLS_DIR = Join-Path $PWD 'skills'
          try { .\install.ps1 -Yes | Out-Null } catch { $failed = $true }
          if (-not $failed) { throw "guard failed: src==dest accepted" }
          if (-not (Test-Path skills\tdd\SKILL.md)) { throw "source damaged" }
          # uninstall removes exactly ours
          $env:CLAUDE_SKILLS_DIR = Join-Path $env:RUNNER_TEMP 'skills'
          .\install.ps1 -Uninstall
          $n = (Get-ChildItem -Recurse -Filter SKILL.md -LiteralPath $env:CLAUDE_SKILLS_DIR -ErrorAction SilentlyContinue).Count
          if ($n -ne 0) { throw "uninstall left $n SKILL.md behind" }

      - name: manifests and frontmatter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'EOF'
          import io, json, os, re
          for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json'):
              json.load(io.open(p, encoding='utf-8'))
          resident, manual = [], []
          for d in sorted(os.listdir('skills')):
              text = io.open(f'skills/{d}/SKILL.md', encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
              assert m, f'{d}: no frontmatter'
              fm = m.group(1)
              name = re.search(r'^name:\s*(\S+)', fm, re.M)
              assert name and name.group(1) == d, f'{d}: name/dir mismatch'
              assert re.search(r'^description:', fm, re.M), f'{d}: no description'
              (manual if re.search(r'^disable-model-invocation:\s*true', fm, re.M)
                      else resident).append(d)
          assert len(resident) == 4 and len(manual) == 5, (resident, manual)
          print('ok: 9 skills,', len(resident), 'resident,', len(manual), 'manual')
          EOF

      - name: diff recipe captures every change class
        if: runner.os == 'Linux'
        shell: bash
        run: |
          R="$RUNNER_TEMP/fixture"; rm -rf "$R"; git init -q "$R"; cd "$R"
          git config user.email ci@ci; git config user.name ci
          printf 'base\n' > kept.txt; printf 'gone\n' > gone.txt; printf 'old\n' > old-name.txt
          git add -A; git commit -qm base
          BASE_SHA=$(git rev-parse HEAD)
          printf 'committed-change\n' >> kept.txt; git commit -aqm feature
          printf 'staged-content\n' > staged.txt; git add staged.txt
          printf 'unstaged-change\n' >> kept.txt
          printf 'untracked-content\n' > 'un tracked.txt'
          git rm -q gone.txt
          git mv old-name.txt new-name.txt
          PATCH=$(git diff "$BASE_SHA")
          STATUS=$(git status --porcelain)
          echo "$PATCH"  | grep -q 'committed-change'   # committed edits visible
          echo "$PATCH"  | grep -q 'staged-content'     # staged file visible
          echo "$PATCH"  | grep -q 'unstaged-change'    # unstaged edits visible
          echo "$PATCH"  | grep -q 'gone.txt'           # deletion visible
          echo "$PATCH"  | grep -q 'new-name.txt'       # rename visible (as delete+add)
          echo "$STATUS" | grep -q 'un tracked.txt'     # untracked via the status channel
          git merge-base "$BASE_SHA" HEAD >/dev/null
          echo "diff recipe: all change classes visible"

      - name: official plugin validation (strict)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json
